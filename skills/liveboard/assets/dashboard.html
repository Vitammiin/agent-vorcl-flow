<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VORCL Liveboard</title>
  <style>
    :root{color-scheme:dark;--bg:#080b12;--panel:#111722cc;--line:#263144;--muted:#93a1b5;--text:#f5f7fb;--cyan:#55e6d7;--violet:#a78bfa;--amber:#fbbf55;--green:#70e1a1;--red:#fb7185}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#163040 0,transparent 32%),radial-gradient(circle at 85% 10%,#2a1949 0,transparent 30%),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,sans-serif}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,#000,transparent 70%)}
    main{position:relative;width:min(1440px,calc(100% - 32px));margin:auto;padding:36px 0 64px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:26px}.eyebrow{color:var(--cyan);font:700 11px/1.2 ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase}h1{font-size:clamp(30px,5vw,64px);line-height:.95;letter-spacing:-.055em;margin:10px 0 12px}.subtitle{max-width:720px;color:var(--muted);font-size:15px}.live{display:flex;align-items:center;gap:9px;border:1px solid #284653;background:#0e2228cc;border-radius:999px;padding:10px 14px;color:#b9fff5;white-space:nowrap}.dot{width:8px;height:8px;background:var(--cyan);border-radius:50%;box-shadow:0 0 18px var(--cyan);animation:pulse 1.8s infinite}@keyframes pulse{50%{opacity:.35;transform:scale(.72)}}
    .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}.stat,.panel,.tree{background:linear-gradient(145deg,#151d2acc,#0d121ccc);border:1px solid var(--line);box-shadow:0 18px 48px #0005;backdrop-filter:blur(14px)}.stat{padding:18px;border-radius:16px}.stat b{display:block;font-size:28px;letter-spacing:-.04em}.stat span{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em}
    .grid{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}.panel{border-radius:20px;padding:20px;min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.panel h2{margin:0;font-size:15px;letter-spacing:.01em}.meta{font:11px ui-monospace,monospace;color:var(--muted)}.controls{display:flex;align-items:center;gap:8px}button,select{border:1px solid #33425b;border-radius:10px;padding:8px 12px;color:var(--text);background:#172132;cursor:pointer}button:hover,select:hover{border-color:var(--cyan)}
    .worktrees{display:grid;gap:12px}.tree{border-radius:15px;padding:16px;background:#0c121bcc}.tree-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.branch{font:700 13px ui-monospace,monospace;color:var(--cyan)}.path{margin-top:4px;color:var(--muted);font:11px ui-monospace,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:620px}.badges,.task-meta{display:flex;gap:6px;flex-wrap:wrap}.badge{padding:4px 8px;border:1px solid #2b374b;border-radius:999px;color:#b8c4d4;font-size:10px}.tasks{display:grid;gap:8px;margin-top:14px}.task{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 11px;border-radius:11px;background:#121a27;border-inline-start:3px solid #536078}.task[data-status="in-progress"]{border-inline-start-color:var(--amber)}.task[data-status="done"]{border-inline-start-color:var(--green);opacity:.68}.task[data-status="blocked"]{border-inline-start-color:var(--red)}.task-id{font:11px ui-monospace,monospace;color:var(--muted)}.task-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font:700 9px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    .agents{display:grid;gap:10px}.agent{position:relative;overflow:hidden;padding:14px;border:1px solid #29364b;border-radius:14px;background:#111927}.agent:after{content:"";position:absolute;inset-block-end:-30px;inset-inline-end:-20px;width:90px;height:90px;background:var(--violet);opacity:.08;filter:blur(20px)}.agent-top{display:flex;justify-content:space-between;gap:10px}.agent-name{font-weight:750}.source{font:10px ui-monospace,monospace;color:var(--violet);text-transform:uppercase}.agent p{margin:7px 0 0;color:var(--muted);font-size:12px}.empty{padding:28px 12px;text-align:center;color:var(--muted);border:1px dashed #334055;border-radius:14px}.footer{display:flex;justify-content:space-between;gap:14px;margin-top:18px;color:#66758a;font:11px ui-monospace,monospace}.error{color:var(--red)}
    .task-meta{grid-column:1/-1;margin-top:2px}.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;font:10px ui-monospace,monospace;border:1px solid #2b374b;color:#b8c4d4;white-space:nowrap}.pill.assignee{color:var(--cyan);border-color:#2e5a55;background:#0e211fcc}.pill.assignee.inferred{color:var(--muted);border-style:dashed}.pill.assignee .live{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}.pill.prio{text-transform:uppercase;letter-spacing:.05em}.pill.prio.high{color:var(--red);border-color:#5a2e39}.pill.prio.medium{color:var(--amber);border-color:#5a4e2e}.pill.prio.low{color:var(--muted)}.task-detail{grid-column:1/-1}.task-detail>summary{cursor:pointer;color:var(--violet);font:10px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.06em;list-style:none;padding:2px 0}.task-detail>summary::-webkit-details-marker{display:none}.task-detail p{margin:6px 0 0;color:var(--muted);font-size:12px;white-space:pre-wrap;max-height:220px;overflow:auto}.agent-elapsed{margin-top:7px;font:10px ui-monospace,monospace;color:var(--muted)}
    @media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.top{flex-direction:column}.live{align-self:flex-start}}@media(max-width:520px){main{width:min(100% - 20px,1440px);padding-top:22px}.stats{grid-template-columns:repeat(2,1fr)}.task{grid-template-columns:42px minmax(0,1fr)}.status{display:none}.footer{flex-direction:column}}
  </style>
</head>

function node(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el}

function taskNode(task){const item=node('div','task');item.dataset.status=task.status;const statusKey='status_'+String(task.status||'').replaceAll('-','_');item.append(node('span','task-id','#'+task.id),node('span','task-title',task.title||t('untitled')),node('span','status',t(statusKey)));const meta=node('div','task-meta');if(task.assignedAgent){const inferred=task.assignedAgent.source==='inferred';const a=pill('assignee'+(inferred?' inferred':''));if(task.agentLive)a.append(node('span','live'));a.append(document.createTextNode(task.assignedAgent.role));a.title=t('assignee')+(inferred?' · '+t('inferred'):'');meta.append(a)}else meta.append(pill('assignee inferred',t('unassigned')));if(task.priority){const pv=t('prio_'+task.priority);meta.append(pill('prio '+task.priority,pv.startsWith('prio_')?task.priority:pv))}if(task.subtaskTotal)meta.append(pill('',task.subtaskDone+'/'+task.subtaskTotal+' '+t('subtasks')));if(task.dependencies&&task.dependencies.length)meta.append(pill('',t('deps')+': '+task.dependencies.map(d=>'#'+d).join(' ')));if(task.updatedAt){const r=rel(task.updatedAt);if(r)meta.append(pill('',t('updated')+' '+r))}item.append(meta);const body=[task.description,task.details].filter(Boolean).join('\n\n');if(body){const d=node('details','task-detail'),s=node('summary','',t('details'));d.append(s,node('p','',body));item.append(d)}return item}
function applyLocale(){document.documentElement.lang=locale;document.documentElement.dir=RTL.has(locale)?'rtl':'ltr';$('eyebrow').textContent=t('eyebrow');$('subtitle').textContent=t('subtitle');$('treeHeading').textContent=t('treeHeading');$('refresh').textContent=t('refresh');$('agentsHeading').textContent=t('agentsHeading');$('sourceNote').textContent=t('sourceNote');$('privacy').textContent=t('privacy');$('language').setAttribute('aria-label',t('language'));$('connection').textContent=t(connectionState);if(lastData)render(lastData)}
function render(data){lastData=data;const labels={worktrees:t('worktrees'),agents:t('agents'),tasks:t('tasks'),inProgress:t('inProgress'),pending:t('pending'),done:t('done')};$('root').textContent=data.root;$('updated').textContent=t('snapshot')+' '+new Intl.DateTimeFormat(locale,{dateStyle:'medium',timeStyle:'medium'}).format(new Date(data.generatedAt));$('stats').replaceChildren(...Object.entries(labels).map(([key,label])=>{const el=node('article','stat');el.append(node('b','',new Intl.NumberFormat(locale).format(data.summary[key]??0)),node('span','',label));return el}));
 const trees=data.worktrees.map(w=>{const el=node('article','tree');const top=node('div','tree-top'),side=node('div'),right=node('div','badges');side.append(node('div','branch',w.branch==='__detached__'?t('detached'):(w.branch||'—')),node('div','path',w.path));right.append(node('span','badge',w.head||'—'),node('span','badge',new Intl.NumberFormat(locale).format(w.counts['in-progress']||0)+' '+t('active')));top.append(side,right);el.append(top);if(w.taskError)el.append(node('p','error',w.taskError));const list=node('div','tasks');const ordered=[...w.tasks].sort((a,b)=>(a.status==='done')-(b.status==='done'));const visible=ordered.slice(0,40);if(!visible.length)list.append(node('div','empty',w.taskFile?t('noOpenTasks'):t('tmNotFound')));else visible.forEach(task=>list.append(taskNode(task)));el.append(list);return el});$('worktrees').replaceChildren(...trees);
 const agents=data.agents.map(a=>{const el=node('article','agent'),top=node('div','agent-top');top.append(node('span','agent-name',a.role||a.product),node('span','source',a.source==='process'?t('process'):t('tasks')));const count=a.processCount||1;const bits=[];if(a.taskId)bits.push('#'+a.taskId+(a.taskTitle?' · '+a.taskTitle:''));else{bits.push(new Intl.NumberFormat(locale).format(count)+' '+t(count===1?'process':'processes'));if(a.cwd)bits.push(a.cwd)}el.append(top,node('p','',bits.join('  ·  ')));if(a.elapsed)el.append(node('div','agent-elapsed',t('active')+' · '+a.elapsed));return el});$('agents').replaceChildren(...(agents.length?agents:[node('div','empty',t('noAgents'))]));}
const select=$('language');for(const [code,name] of Object.entries(LANGS)){const option=node('option','',name);option.value=code;select.append(option)}select.value=locale;select.onchange=()=>{locale=select.value;applyLocale()};applyLocale();async function load(){const r=await fetch('/api/snapshot',{cache:'no-store'});render(await r.json())}$('refresh').onclick=()=>fetch('/api/refresh',{method:'POST'});load().catch(()=>{});const stream=new EventSource('/api/events');stream.addEventListener('snapshot',e=>{render(JSON.parse(e.data));connectionState='live';$('connection').textContent=t(connectionState)});stream.onopen=()=>{connectionState='live';$('connection').textContent=t(connectionState)};stream.onerror=()=>{connectionState='reconnecting';$('connection').textContent=t(connectionState)};
</script></body></html>
