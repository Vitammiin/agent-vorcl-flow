<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__ARCHMAP_TITLE__ · archmap</title>
<style>
/* ══ токены темы ══
   Тёмная — по умолчанию, светлая — html[data-theme="light"].
   Всё, что рисуется в SVG, тоже читает эти переменные, поэтому
   переключение темы и печать не требуют правки узлов вручную. */
:root{
  color-scheme:dark;
  --bg:#080d18;--bg-g1:#16233f7a;--bg-g2:#1e163a7a;
  --panel:#0f1728;--panel2:#0c1322;--panel3:#0a101d;
  --line:#1b2438;--line2:#27334c;
  --text:#e9eefb;--muted:#94a3bd;--faint:#66748d;
  --accent:#4fdfd2;--accent2:#a5f3eb;--accent-bg:#4fdfd21f;
  --card-mid:#101a2e;--card-low:#0a1220;--frame:#101827f0;--plate:#0a1120ee;--exp:#080f1cf0;
  --grid:#ffffff;--grid-op:.05;
  --btn:#141d31;--btn2:#1b2740;
  --shadow:0 24px 60px #000000a6;--shadow-s:0 8px 22px #0000006b;
  --ok:#34d399;--warn:#fbbf24;--bad:#fb7185;
  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  /* типографическая шкала */
  --fz-hero:30px;--fz-h1:17px;--fz-h2:15px;--fz-md:12.5px;--fz-sm:11px;
  --r1:14px;--r2:10px;--r3:7px;
  --dur:.16s;
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#eef2f8;--bg-g1:#cfe0f524;--bg-g2:#e4dcf824;
  --panel:#ffffff;--panel2:#f7f9fd;--panel3:#eef2f9;
  --line:#dde4ef;--line2:#c9d4e4;
  --text:#0e1729;--muted:#55637a;--faint:#7e8ca3;
  --accent:#0d8f85;--accent2:#0a6f68;--accent-bg:#0d8f8514;
  --card-mid:#ffffff;--card-low:#f4f7fc;--frame:#fffffff2;--plate:#ffffffee;--exp:#fbfdffe6;
  --grid:#0f172a;--grid-op:.055;
  --btn:#ffffff;--btn2:#eef3fa;
  --shadow:0 20px 44px #17203a1f;--shadow-s:0 6px 16px #17203a14;
  --ok:#0f9d63;--warn:#b7791f;--bad:#dc4c5f;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:var(--fz-md)/1.45 var(--sans);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent-bg)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

/* ══ шапка ══ */
header{display:flex;flex-direction:column;background:linear-gradient(180deg,var(--panel),var(--panel2));border-bottom:1px solid var(--line);z-index:5;box-shadow:var(--shadow-s)}
.hrow{display:flex;align-items:center;gap:10px;padding:9px 14px}
.hrow.tools{padding:0 14px 9px;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:2px}
.eyebrow{font:700 8.5px/1 var(--mono);letter-spacing:.3em;color:var(--accent);text-transform:uppercase}
h1{margin:3px 0 0;font:700 var(--fz-h1)/1.1 var(--mono);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.counts{display:flex;gap:9px;align-items:center;font:10.5px var(--mono);color:var(--muted);padding-left:12px;margin-left:2px;border-left:1px solid var(--line2);white-space:nowrap}
.counts b{color:var(--text);font-weight:700}
.spacer{margin-left:auto}

.seg{display:inline-flex;border:1px solid var(--line2);background:var(--panel3);border-radius:var(--r2);padding:2px;gap:2px}
.seg[hidden]{display:none}
.seg button{border:0;background:transparent;color:var(--muted);font:700 var(--fz-sm) var(--mono);letter-spacing:.04em;padding:6px 14px;border-radius:var(--r3);cursor:pointer;transition:color var(--dur),background var(--dur)}
.seg button.on{background:var(--btn2);color:var(--accent2);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 42%,transparent)}
html[data-theme="light"] .seg button.on{color:var(--accent2);background:var(--accent-bg)}
.seg button:hover{color:var(--text)}

.searchwrap{position:relative;display:flex;align-items:center}
#search{background:var(--panel3);border:1px solid var(--line2);border-radius:var(--r2);color:var(--text);font:12px var(--mono);padding:7px 34px 7px 11px;width:236px;outline:none;transition:border-color var(--dur),box-shadow var(--dur)}
#search::placeholder{color:var(--faint)}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.searchwrap kbd{position:absolute;right:8px;pointer-events:none;font:700 9px var(--mono);color:var(--faint);border:1px solid var(--line2);border-radius:5px;padding:2px 5px;background:var(--panel)}
#search:focus + kbd{opacity:0}

.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;flex:none;border:1px solid var(--line2);background:var(--btn);color:var(--muted);border-radius:var(--r2);cursor:pointer;transition:color var(--dur),border-color var(--dur),background var(--dur),transform var(--dur)}
.iconbtn:hover{color:var(--text);border-color:var(--accent);background:var(--btn2)}
.iconbtn:active{transform:translateY(1px)}
.iconbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.on{color:var(--accent2);border-color:var(--accent)}
.igroup{display:flex;gap:6px;align-items:center}
.idiv{width:1px;height:22px;background:var(--line2);margin:0 2px}
html[data-theme="light"] .i-moon,html:not([data-theme="light"]) .i-sun{display:none}

.btn{border:1px solid var(--line2);background:var(--btn);color:var(--text);border-radius:var(--r2);padding:7px 12px;font:600 var(--fz-sm) var(--mono);cursor:pointer;transition:border-color var(--dur),background var(--dur)}
.btn:hover{border-color:var(--accent);background:var(--btn2)}
.btn[hidden]{display:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#04201e;font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}

/* чипы слоёв и потоков */
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{--c:#94a3b8;display:inline-flex;align-items:center;gap:6px;border:1px solid color-mix(in srgb,var(--c) 62%,transparent);color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);border-radius:999px;padding:5px 11px;font:700 10px var(--mono);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;transition:opacity var(--dur),filter var(--dur),background var(--dur)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--c)}
.chip .num{color:color-mix(in srgb,var(--c) 70%,var(--text));font-weight:700;opacity:.85}
.chip:hover{background:color-mix(in srgb,var(--c) 20%,transparent)}
.chip.off{opacity:.42;border-color:var(--line2);color:var(--faint);background:transparent;filter:saturate(.25)}
.chip.big{padding:5px 13px;font-size:10.5px}
.chip-sep{font:700 8.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin:0 2px 0 8px;align-self:center}
.flowchip{--c:#7c8aa3;font-size:9.5px;padding:4px 9px;text-transform:none;letter-spacing:.02em}
label.inf-toggle{display:inline-flex;align-items:center;gap:6px;font:10.5px var(--mono);color:var(--muted);border:1px dashed var(--line2);border-radius:999px;padding:5px 11px;cursor:pointer;user-select:none}
label.inf-toggle input{accent-color:#a78bfa;margin:0}

/* ══ сцена ══ */
main{flex:1;display:flex;min-height:0;position:relative}
#stage{flex:1;min-width:0;position:relative;display:flex}
#canvas{flex:1;min-width:0;display:block;cursor:grab;touch-action:none;background:
  radial-gradient(1200px 560px at 22% -14%,var(--bg-g1) 0,transparent 62%),
  radial-gradient(980px 540px at 94% 114%,var(--bg-g2) 0,transparent 58%),var(--bg)}
#canvas.panning{cursor:grabbing}

/* хлебные крошки */
#crumbbar{position:absolute;top:10px;left:12px;right:12px;display:flex;align-items:center;gap:8px;pointer-events:none;z-index:2}
.glass{background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow-s);backdrop-filter:blur(9px)}
#crumbs{display:flex;align-items:center;gap:2px;padding:5px 12px;max-width:min(70%,760px);overflow:hidden;pointer-events:auto}
#crumbs .cr{font:600 11px var(--sans);color:var(--muted);background:none;border:0;padding:3px 6px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px;transition:color var(--dur),background var(--dur)}
#crumbs .cr:hover{color:var(--text);background:var(--btn2)}
#crumbs .cr.last{color:var(--text);font-weight:700;cursor:default}
#crumbs .cr.last:hover{background:none}
#crumbs .sep{color:var(--faint);font-size:11px;padding:0 1px;user-select:none}
#crumbs .lc{width:7px;height:7px;border-radius:2px;flex:none;margin-right:5px;display:inline-block}
#histbar{display:flex;gap:2px;padding:4px;pointer-events:auto}
#histbar button,#zoomer button{width:27px;height:25px;border:0;background:none;color:var(--muted);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#histbar button:hover:not(:disabled),#zoomer button:hover{color:var(--text);background:var(--btn2)}
#histbar button:disabled{opacity:.32;cursor:default}
#histbar svg,#zoomer svg{width:13.5px;height:13.5px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* нижняя панель канваса: зум + минимапа */
#stagetools{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:2}
#zoomer{display:flex;align-items:center;gap:2px;padding:4px}
#zoomlvl{font:700 10px var(--mono);color:var(--faint);padding:0 6px;min-width:44px;text-align:center}
#minimap{width:246px;padding:8px;border-radius:var(--r1);position:relative}
#minimap[hidden]{display:none}
#minimap .mmtitle{display:flex;align-items:center;justify-content:space-between;font:700 8.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:5px;padding:0 2px}
#minimap .mmtitle button{border:0;background:none;color:var(--faint);cursor:pointer;font:11px var(--mono);padding:0 2px;line-height:1}
#minimap .mmtitle button:hover{color:var(--text)}
#mmsvg{display:block;width:230px;height:150px;cursor:crosshair;border-radius:var(--r3);background:color-mix(in srgb,var(--bg) 70%,transparent)}
#mmsvg .mmv{fill:color-mix(in srgb,var(--accent) 14%,transparent);stroke:var(--accent);stroke-width:1.4;vector-effect:non-scaling-stroke}

/* пустое состояние */
#emptystate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:1}
#emptystate[hidden]{display:none}
#emptystate .box{pointer-events:auto;text-align:center;padding:26px 30px;border-radius:var(--r1);background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);box-shadow:var(--shadow)}
#emptystate h4{margin:0 0 6px;font:700 14px var(--sans)}
#emptystate p{margin:0 0 14px;font:11.5px var(--sans);color:var(--muted);max-width:320px}

/* ══ панель деталей ══ */
#details{width:404px;flex:none;background:var(--panel2);border-left:1px solid var(--line);overflow-y:auto;padding:0 0 20px;font-family:var(--sans);position:relative}
#details[hidden]{display:none}
#details .dhead{position:sticky;top:0;background:linear-gradient(180deg,var(--panel),var(--panel2));border-bottom:1px solid var(--line);padding:13px 16px 12px;z-index:2}
#details .dbody{padding:0 16px}
#details .d-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:7px}
#details .kbadge{--c:#94a3b8;font:700 8.5px var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 58%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent);border-radius:5px;padding:3px 7px}
#details .d-inferred{font:700 8.5px var(--mono);letter-spacing:.1em;color:#c4b5fd;border:1px dashed #a78bfa;border-radius:5px;padding:3px 7px}
#details .dclose{position:absolute;top:11px;right:12px;width:26px;height:26px;border:1px solid var(--line2);background:var(--btn);color:var(--muted);border-radius:7px;cursor:pointer;font:14px/1 var(--sans)}
#details .dclose:hover{color:var(--text);border-color:var(--accent)}
#details h2{margin:0;font:700 var(--fz-h2)/1.3 var(--sans);word-break:break-word;padding-right:30px}
#details .src{display:flex;align-items:center;gap:8px;background:var(--panel3);border:1px solid var(--line);border-radius:var(--r3);padding:7px 9px;margin:12px 0}
#details .src code{flex:1;font:10.5px var(--mono);color:var(--accent2);word-break:break-all}
html[data-theme="light"] #details .src code{color:var(--accent2)}
#details .copy{border:1px solid var(--line2);background:var(--btn);color:var(--muted);border-radius:6px;font:10px var(--mono);padding:4px 8px;cursor:pointer;flex:none}
#details .copy:hover{color:var(--text);border-color:var(--accent)}
#details h3{margin:17px 0 7px;font:700 9px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:7px}
#details .twrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
#details table{width:100%;border-collapse:collapse;font:10.5px var(--mono)}
#details td,#details th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
#details td:first-child{max-width:190px;overflow:hidden;text-overflow:ellipsis}
#details th{color:var(--faint);font-weight:600;font-size:9px;letter-spacing:.08em;text-transform:uppercase}
#details td.flag{color:#f472b6;white-space:nowrap}
html[data-theme="light"] #details td.flag{color:#c2185b}
#details .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font:10.5px var(--mono)}
#details .kv b{color:var(--faint);font-weight:600}
#details .kv span{color:var(--text);word-break:break-word}
#details .rel{list-style:none;margin:0;padding:0}
#details .rel li{display:flex;align-items:center;gap:7px;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r3);margin-bottom:5px;cursor:pointer;font:11px var(--sans);background:var(--panel3);transition:border-color var(--dur),background var(--dur),transform var(--dur)}
#details h3::after,.sec h3::after{content:'';flex:1;height:1px;background:var(--line)}
#details .rel li:hover{border-color:var(--accent);background:var(--btn2);transform:translateX(2px)}
#details .rel li.nohover{cursor:default}
#details .rel li.nohover:hover{transform:none;border-color:var(--line);background:var(--panel3)}
#details .rel .ek{font:700 8.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:2px 5px;flex:none}
#details .rel .en{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#details .rel .en small{color:var(--faint)}
#details .rel .cnt{margin-left:auto;font:700 9.5px var(--mono);color:var(--faint);flex:none}
#details .whyrel{list-style:none;margin:0;padding:0}
#details .whyrel li{display:flex;gap:8px;align-items:baseline;padding:4px 0;font:11px/1.4 var(--sans);color:var(--muted)}
#details .whyrel b{font:700 9px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--text);flex:none;min-width:74px}
#details .tracebar{display:flex;gap:6px;margin:12px 0 2px}
#details .tracebar .btn{flex:1;padding:8px 6px;text-align:center}
#details .empty{color:var(--faint);font:10.5px var(--mono)}
#details .pills{display:flex;flex-wrap:wrap;gap:6px}
#details .pill{--c:#94a3b8;font:700 10px var(--mono);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent);border-radius:999px;padding:4px 9px}

/* ══ подвал / легенда ══ */
footer{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:7px 14px;border-top:1px solid var(--line);background:var(--panel2);font:10px var(--mono);color:var(--muted);z-index:3}
footer .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
footer .lg i{width:9px;height:9px;border-radius:3px;display:inline-block}
footer .lg.dash i{background:transparent!important;border:1px dashed var(--muted)}
footer .lg.thick i{width:22px;height:0;border-radius:0;border-top:3px solid var(--muted);opacity:.8}
footer .fdiv{width:1px;height:14px;background:var(--line2)}
footer .fcounts{margin-left:auto;color:var(--faint)}
footer .hint{color:var(--faint)}

/* ══ SVG-граф ══ */
text{font-family:var(--mono);user-select:none}
.lane-bg{pointer-events:none}
.lane-label{font-size:10px;font-weight:700;letter-spacing:.22em;pointer-events:none}
.node{cursor:pointer}
.gridline{fill:none;stroke:var(--grid);stroke-opacity:var(--grid-op)}
.stop-mid{stop-color:var(--card-mid)}
.stop-low{stop-color:var(--card-low)}
.frame{fill:var(--frame);stroke-width:1.2;transition:stroke-width var(--dur)}
.node.inf .frame{stroke-dasharray:5 4}
.thead{pointer-events:none}
.nlabel{fill:var(--text);font-size:11.5px;font-weight:600}
.nkind{font-size:7.5px;font-weight:700;letter-spacing:.1em;opacity:.9}
.nmut{fill:var(--muted);font-size:9px}
.ncol{fill:color-mix(in srgb,var(--text) 78%,transparent);font-size:10px}
.ncol .cty{fill:var(--faint)}
.nmore{fill:var(--faint);font-size:9px;font-style:italic}
.nsep{stroke:var(--line2);stroke-width:1}
.edge{fill:none;stroke-width:1.1;opacity:.45;pointer-events:stroke;transition:opacity var(--dur)}
.node.matched .frame{stroke-width:2.6}
.hidden{display:none}
.dimmed{opacity:.12;pointer-events:none}
.edge.traced{stroke-dasharray:7 4;animation:dashflow .8s linear infinite;opacity:1;stroke-width:1.7}
@keyframes dashflow{to{stroke-dashoffset:-22}}
.node.feat .frame{stroke-width:1.8}
#emptymsg{fill:var(--faint);font-size:14px}

/* обзор: тир-полосы, блоки групп, потоки */
.tier-band{pointer-events:none}
.tier-title{font-size:19px;font-weight:800;letter-spacing:.2em;pointer-events:none}
.tier-sub{font-size:11px;fill:var(--faint);letter-spacing:.06em;pointer-events:none}
.tier-band .halo{opacity:0;transition:opacity .2s}
.tier-band.act .halo{opacity:1}
.gcard{cursor:pointer}
.gframe{stroke-width:1.5;transition:stroke-width var(--dur)}
.gcard.inf .gframe{stroke-dasharray:6 5}
.gcard.more .gframe{stroke-dasharray:6 6;fill:var(--card-low)}
.gtitle{font-family:var(--sans);font-size:16.5px;font-weight:700;fill:var(--text)}
.gcard.big .gtitle{font-size:20px;font-weight:800}
.gsub{font-size:11px;fill:var(--muted);letter-spacing:.02em}
.gsrc{font-size:9.5px;fill:var(--faint)}
.gitem{font-family:var(--sans);font-size:11.5px;fill:var(--muted)}
.gnum{font-size:11px;font-weight:700;letter-spacing:.04em}
.gbar-bg{fill:color-mix(in srgb,var(--text) 12%,transparent)}
.gicon{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.bmono{font-size:9.5px;font-weight:800;letter-spacing:.02em;pointer-events:none}
.ghead{pointer-events:none}
.gplus{fill:none;stroke-width:1.3;opacity:.65;transition:opacity var(--dur)}
.gcard:hover .gplus{opacity:1}
.gcard.matched .gframe{stroke-width:3.4}
.gcard.hasmatch .gframe{stroke-width:2.6;stroke-dasharray:3 3}
.gedge{fill:none;pointer-events:stroke;opacity:.9;transition:opacity var(--dur)}
.gedge:hover{opacity:1}
.gedge.traced{stroke-dasharray:9 5;animation:dashflow .8s linear infinite;opacity:1}
.gelabel{font-size:10.5px;font-weight:700;letter-spacing:.03em}
.geplate{fill:var(--plate);stroke-width:1}
.expframe{fill:var(--exp);stroke-width:1.6}
.exphead{font-family:var(--sans);font-size:16px;font-weight:700;fill:var(--text)}
.expsub{font-size:10.5px;fill:var(--muted)}
.collapse-btn{cursor:pointer}
.collapse-btn rect{fill:var(--btn);stroke-width:1}
.collapse-btn text{font-size:10.5px;font-weight:700;fill:var(--muted)}
.collapse-btn:hover rect{stroke:var(--accent)}
.collapse-btn:hover text{fill:var(--text)}
.hit{fill:transparent}

/* ══ модальные слои ══ */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;background:color-mix(in srgb,var(--bg) 74%,transparent);backdrop-filter:blur(7px);animation:fade .18s ease-out}
.overlay[hidden]{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sheet{background:var(--panel);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);max-width:1040px;width:100%;max-height:100%;overflow:auto;animation:rise .2s ease-out}
.sheet.narrow{max-width:640px}
.sheet .shead{display:flex;align-items:flex-start;gap:16px;padding:26px 30px 18px;border-bottom:1px solid var(--line);background:
   radial-gradient(600px 200px at 0% 0%,var(--accent-bg) 0,transparent 70%)}
.sheet .shead .t{flex:1;min-width:0}
.sheet .kicker{font:700 8.5px var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.sheet h2{margin:7px 0 4px;font:800 var(--fz-hero)/1.1 var(--sans);letter-spacing:-.02em;word-break:break-word}
.sheet .subtle{font:11.5px var(--mono);color:var(--faint)}
.sheet .sbody{padding:20px 30px 26px}
.sheet .sfoot{display:flex;align-items:center;gap:10px;padding:16px 30px 24px;flex-wrap:wrap}
.sheet .sfoot .note{font:10.5px var(--mono);color:var(--faint);margin-left:auto}
.xbtn{width:30px;height:30px;flex:none;border:1px solid var(--line2);background:var(--btn);color:var(--muted);border-radius:9px;cursor:pointer;font:15px/1 var(--sans)}
.xbtn:hover{color:var(--text);border-color:var(--accent)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px;margin:2px 0 20px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2);padding:11px 12px}
.tile b{display:block;font:800 21px/1.05 var(--mono);letter-spacing:-.02em;color:var(--text)}
.tile span{display:block;margin-top:3px;font:9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.tile.acc b{color:var(--accent)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px 26px}
.sec{margin-bottom:20px}
.sec h3{margin:0 0 9px;font:700 9px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:8px}
.stacklist{display:flex;flex-wrap:wrap;gap:7px}
.stackpill{display:inline-flex;align-items:baseline;gap:7px;border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:6px 12px;font:700 11px var(--mono);color:var(--text)}
.stackpill em{font-style:normal;font-weight:400;font-size:9.5px;color:var(--faint)}
.toplist{list-style:none;margin:0;padding:0}
.toplist li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r3);border:1px solid var(--line);background:var(--panel2);margin-bottom:6px;cursor:pointer;transition:border-color var(--dur),transform var(--dur)}
.toplist li:hover{border-color:var(--accent);transform:translateX(2px)}
.toplist .rank{font:800 11px var(--mono);color:var(--faint);width:16px;flex:none}
.toplist .nm{flex:1;min-width:0;font:600 12px var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toplist .nm small{display:block;font:9.5px var(--mono);color:var(--faint);font-weight:400}
.toplist .mt{font:700 10px var(--mono);color:var(--muted);flex:none}
.toplist .bar{height:4px;border-radius:2px;flex:none;width:54px;background:var(--line);overflow:hidden}
.toplist .bar i{display:block;height:100%;border-radius:2px}
.findings{list-style:none;margin:0;padding:0}
.findings li{display:flex;gap:9px;align-items:flex-start;padding:7px 0;font:11.5px/1.45 var(--sans);color:var(--muted);border-bottom:1px solid var(--line)}
.findings li:last-child{border-bottom:0}
.findings .fi{width:8px;height:8px;border-radius:50%;flex:none;margin-top:5px}
.findings b{color:var(--text);font-weight:700}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px 22px}
.keys div{display:flex;align-items:center;gap:10px;padding:5px 0;font:11.5px var(--sans);color:var(--muted);border-bottom:1px solid var(--line)}
.keys kbd{font:700 10px var(--mono);color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;padding:3px 7px;min-width:24px;text-align:center;flex:none}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);z-index:30;padding:10px 18px;border-radius:999px;background:var(--panel);border:1px solid var(--line2);box-shadow:var(--shadow);font:12px var(--sans);color:var(--text);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
#toast.on{opacity:1;transform:translateX(-50%)}

/* ══ приложение (только печать) ══ */
#appendix{display:none}

<script id="archmap-data" type="application/json">__ARCHMAP_JSON__</script>
<script>
'use strict'
/* archmap interactive template — раскладка и интеракции целиком на клиенте.
   ОБЗОР  — блоки групп (data.groups) + агрегированные потоки (data.groupEdges);
            любой блок разворачивается в детальный рендер своих узлов на месте.
   ДЕТАЛИ — поузловая карта (data.nodes/data.edges).
   Раскладка и trace — компактная копия scripts/lib/graph.mjs: браузер не может
   импортировать node-модули пайплайна.
   Данные попадают в DOM только через textContent/createElementNS. */
/* если библиотека значков не подставлена, плейсхолдер остаётся текстом — убираем */
{
  const mark = '__ARCHMAP' + '_BRANDS__'
  for (const node of [...document.body.childNodes]) {
    if (node.nodeType === 3 && node.textContent.includes(mark)) node.remove()
  }
}
const data = JSON.parse(document.getElementById('archmap-data').textContent)
const FALLBACK_LAYERS = [
  { id: 'product', label: 'Product', color: '#f87171' },
  { id: 'client', label: 'Client', color: '#38bdf8' },
  { id: 'api', label: 'API', color: '#34d399' },
  { id: 'agents', label: 'Agents', color: '#a78bfa' },
  { id: 'logic', label: 'Logic', color: '#fbbf24' },
  { id: 'data', label: 'Data', color: '#f472b6' },
  { id: 'infra', label: 'Infra', color: '#94a3b8' },
]
const layers = Array.isArray(data.layers) && data.layers.length ? data.layers : FALLBACK_LAYERS
const nodes = Array.isArray(data.nodes) ? data.nodes : []
const edges = Array.isArray(data.edges) ? data.edges : []
const nodeById = new Map(nodes.map(n => [n.id, n]))
const layerById = {}
for (const l of layers) layerById[l.id] = l
/* Продуктовый слой — «шапка» карты: его блоки крупнее и акцентнее прочих. */
const PRODUCT_KINDS = new Set(['feature', 'capability'])
const productLayerIds = new Set(layers.filter(l => l.id === 'product').map(l => l.id))
for (const n of nodes) if (PRODUCT_KINDS.has(n.kind) && layerById[n.layer]) productLayerIds.add(n.layer)

const METHOD_COLORS = { GET: '#34d399', POST: '#60a5fa', PUT: '#fbbf24', PATCH: '#a78bfa', DELETE: '#f87171' }
const NODE_W = 240
const GAP_X = 130
const GAP_Y = 26
const LANE_PAD = 52
const SUB_GAP_X = 26      // зазор между подколонками внутри одного лейна
const TARGET_H = 2400     // выше этого колонка переносится в следующую подколонку
const SVGNS = 'http://www.w3.org/2000/svg'

/* ── ОБЗОР: геометрия ── */
const CARD_W = 296
const CARD_H = 118
const CARD_H_BIG = 176      // продуктовые блоки — заметно крупнее
const CARD_GX = 26
const CARD_GY = 26
const TIER_LABEL = 58       // высота шапки тир-полосы
const TIER_GAP = 78         // зазор между слоями
const TIER_PADX = 26
const LANE_CAP = 12         // сколько блоков показываем в слое до «+N ещё»
const EXP_NW = 240          // ширина узла внутри развёрнутой группы
const EXP_GX = 22
const EXP_GY = 18
const EXP_PAD = 22
const EXP_HEAD = 54

/* ── тема ── */
const LS_KEY = 'archmap.theme'
function readTheme () {
  try { return localStorage.getItem(LS_KEY) } catch (err) { return null }
}
function writeTheme (v) {
  try { localStorage.setItem(LS_KEY, v) } catch (err) { /* file:// без хранилища — молча */ }
}
let theme = readTheme() === 'light' ? 'light' : 'dark'
if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light')
const isLight = () => theme === 'light'

function hexToRgb (hex) {
  const h = String(hex || '').replace('#', '')
  const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h
  const num = parseInt(full.slice(0, 6), 16)
  if (!Number.isFinite(num)) return { r: 148, g: 163, b: 184 }
  return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 }
}
function rgbToHex (c) {
  const to = v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')
  return '#' + to(c.r) + to(c.g) + to(c.b)
}
function mixHex (a, b, t) {
  const x = hexToRgb(a); const y = hexToRgb(b)
  return rgbToHex({ r: x.r + (y.r - x.r) * t, g: x.g + (y.g - x.g) * t, b: x.b + (y.b - x.b) * t })
}
/* На белом фоне неоновые цвета слоёв выглядят дёшево и плохо читаются —
   в светлой теме притемняем их, сохраняя оттенок. */
function themed (hex) { return isLight() ? mixHex(hex, '#0b1424', 0.34) : hex }
const rawLayerColor = id => (layerById[id] || { color: '#94a3b8' }).color
const layerColor = id => themed(rawLayerColor(id))
const layerLabel = id => (layerById[id] || { label: id }).label

/* ── группы (могут отсутствовать в старых architecture.json) ─ */
const groupOf = new Map()     // nodeId -> groupId
const groups = []
for (const raw of (Array.isArray(data.groups) ? data.groups : [])) {
  if (!raw || !raw.id) continue
  const members = (Array.isArray(raw.members) ? raw.members : []).filter(id => nodeById.has(id))
  const label = (raw.label && String(raw.label).trim()) || String(raw.id).split(':').pop() || raw.id
  const g = {
    id: raw.id,
    layer: layerById[raw.layer] ? raw.layer : 'infra',
    label,
    members,
    counts: (raw.counts && typeof raw.counts === 'object') ? raw.counts : {},
    size: typeof raw.size === 'number' ? raw.size : members.length,
    source: raw.source || null,
    inferred: !!raw.inferred,
  }
  groups.push(g)
  for (const m of members) if (!groupOf.has(m)) groupOf.set(m, g.id)
}
/* узлы вне групп не должны исчезать из обзора — собираем их в «Прочее» по слою */
if (groups.length) {
  const rest = new Map()
  for (const n of nodes) {
    if (groupOf.has(n.id)) continue
    if (!rest.has(n.layer)) rest.set(n.layer, [])
    rest.get(n.layer).push(n)
  }
  for (const [layer, list] of rest) {
    const g = {
      id: 'grp:__rest:' + layer,
      layer: layerById[layer] ? layer : 'infra',
      label: 'Прочее',
      members: list.map(n => n.id),
      counts: {},
      size: list.length,
      source: null,
      inferred: false,
      synthetic: true,
    }
    for (const n of list) { g.counts[n.kind] = (g.counts[n.kind] || 0) + 1; groupOf.set(n.id, g.id) }
    groups.push(g)
  }
}
const groupById = new Map(groups.map(g => [g.id, g]))

const KIND_ICON = {
  feature: 'k:feature', capability: 'k:feature', container: 'k:container', 'ci-pipeline': 'k:ci',
  'test-suite': 'k:test', hook: 'k:hook', command: 'k:command', skill: 'k:skill', 'mcp-tool': 'k:tool',
  'mcp-server': 'agents', agent: 'agents', 'llm-call': 'cat:ai', table: 'cat:database', store: 'cat:cache-queue',
  env: 'cat:auth', middleware: 'cat:auth', route: 'api', webhook: 'api', ws: 'api', module: 'logic',
}
// Группа библиотек/сервисов рисуется иконкой своей категории, остальные — иконкой слоя.
function iconKeyOf (item) {
  const id = String(item.id || '')
  const techCat = id.match(/^grp:infra:tech:(.+)$/)
  if (techCat) return `cat:${techCat[1]}`
  if (id === 'grp:infra:services') return 'cat:cloud'
  const counts = item.counts || {}
  if (productLayerIds.has(item.layer)) return 'product'
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0]
  if (top && KIND_ICON[top[0]]) return KIND_ICON[top[0]]
  if (counts.store) return 'cat:cache-queue'
  return item.layer
}

/* ── ДЕТАЛИ: колонки по слоям + barycenter (3 прохода) ── */
const posD = new Map()
const dNodeEls = new Map()
const dEdgeEls = new Map()
const dLaneEls = new Map()
let detailsBuilt = false
let detailCols = []
let detailMaxH = 0
function layoutDetails () {
  posD.clear()
  const cols = []
  for (const layer of layers) {
    const list = nodes.filter(n => n.layer === layer.id)
    if (list.length) cols.push({ layer, list })
  }
  const index = new Map()
  cols.forEach((col, ci) => {
    col.list.sort((a, b) => a.id.localeCompare(b.id))
    col.list.forEach((n, ri) => index.set(n.id, { ci, ri }))
  })
  const neigh = new Map()
  for (const e of edges) {
    if (!neigh.has(e.from)) neigh.set(e.from, [])
    if (!neigh.has(e.to)) neigh.set(e.to, [])
    neigh.get(e.from).push(e.to)
    neigh.get(e.to).push(e.from)
  }
  for (let pass = 0; pass < 3; pass++) {
    for (const col of cols) {
      const scored = col.list.map(n => {
        const rows = (neigh.get(n.id) || [])
          .map(id => { const i = index.get(id); return i && i.ri })
          .filter(r => r !== undefined && r !== false)
        const bary = rows.length ? rows.reduce((s, r) => s + r, 0) / rows.length : index.get(n.id).ri
        return { n, bary }
      })
      scored.sort((a, b) => a.bary - b.bary || a.n.id.localeCompare(b.n.id))
      scored.forEach((sc, ri) => { index.get(sc.n.id).ri = ri })
      col.list = scored.map(sc => sc.n)
    }
  }
  // Слой с сотнями узлов вытянулся бы в нечитаемую вертикальную нить,
  // поэтому длинная колонка переносится в несколько подколонок внутри своего лейна.
  let maxH = 0
  cols.forEach(col => {
    let total = 0
    for (const n of col.list) total += nodeHeight(n) + GAP_Y
    total = Math.max(0, total - GAP_Y)
    col.subCount = Math.max(1, Math.ceil(total / TARGET_H))
    col.height = col.subCount === 1 ? total : Math.min(TARGET_H, Math.ceil(total / col.subCount) + 120)
    col.width = col.subCount * NODE_W + (col.subCount - 1) * SUB_GAP_X
    maxH = Math.max(maxH, col.height)
  })
  let laneX = 0
  cols.forEach(col => {
    col.x = laneX
    const limit = col.subCount === 1 ? Infinity : col.height
    let sub = 0
    let y = LANE_PAD + (maxH - col.height) / 2
    const top = y
    for (const n of col.list) {
      const h = nodeHeight(n)
      if (y > top && y + h - top > limit && sub < col.subCount - 1) {
        sub++
        y = top
      }
      posD.set(n.id, { x: laneX + sub * (NODE_W + SUB_GAP_X), y, w: NODE_W, h, ci: cols.indexOf(col), sub })
      y += h + GAP_Y
    }
    laneX += col.width + GAP_X
  })
  detailCols = cols
  detailMaxH = maxH
}

/* рёбра детального режима: кубические Безье между колонками */
function edgePathD (a, b) {
  if (a.ci === b.ci && a.sub === b.sub) {
    const x = a.x + a.w
    const y1 = a.y + a.h / 2
    const y2 = b.y + b.h / 2
    return `M ${x} ${y1} C ${x + 72} ${y1} ${x + 72} ${y2} ${x} ${y2}`
  }
  const forward = b.x >= a.x
  const x1 = forward ? a.x + a.w : a.x
  const x2 = forward ? b.x : b.x + b.w
  const y1 = a.y + a.h / 2
  const y2 = b.y + b.h / 2
  const dx = Math.min(160, Math.max(40, Math.abs(b.ci - a.ci) * 40 + 40)) * (forward ? 1 : -1)
  return `M ${x1} ${y1} C ${x1 + dx} ${y1} ${x2 - dx} ${y2} ${x2} ${y2}`
}
function buildDetails () {
  if (detailsBuilt) return

    label.setAttribute('fill-opacity', .85)

  }
  for (const n of nodes) {

  }
  for (const e of edges) {
    const a = posD.get(e.from)

    const from = nodeById.get(e.from)

    const p = s('path', { class: 'edge', d: edgePathD(a, b), stroke: layerColor(lay), 'marker-end': `url(#arr-${lay})` })

    p.append(tip)
    dEdgeEls.set(e.id, p)
    edgeG.append(p)
  }
  if (!nodes.length) {
    const msg = st(0, 0, 'architecture.json: нет узлов', '', null)
    msg.setAttribute('id', 'emptymsg')
    gDetails.append(msg)
  }
  applyVisibility()
}

/* ── ОБЗОР: раскладка ── */
let mode = HAS_GROUPS ? 'overview' : 'details'
const expanded = new Set()      // развёрнутые группы
const laneOpen = new Set()      // слои, где показаны все группы (а не топ-N)
const posO = new Map()          // id (группы / «more» / узла) -> {x,y,w,h}
const oCardEls = new Map()
const oNodeEls = new Map()
const oLaneEls = new Map()
const oEdgeEls = []
const hiddenHost = new Map()    // groupId скрытой группы -> id карточки «+N ещё»
let ovBounds = null
let ovBoxes = []                // прямоугольники для мини-карты

const inferredToggle = document.getElementById('inferredToggle')
const inferredOn = () => inferredToggle.checked
function groupVisible (g) { return !hiddenLayers.has(g.layer) && (inferredOn() || !g.inferred) }
function groupMembers (g) {
  return g.members.map(id => nodeById.get(id)).filter(n => n && (inferredOn() || !n.inferred))
}
function expandedBox (g) {
  const members = groupMembers(g)
  const cols = Math.max(1, Math.min(members.length || 1, Math.min(10, Math.round(Math.sqrt(Math.max(1, members.length) * 2.4)))))
  const colH = new Array(cols).fill(0)
  const place = []
  for (const n of members) {
    let ci = 0
    for (let i = 1; i < cols; i++) if (colH[i] < colH[ci]) ci = i
    const h = nodeHeight(n)
    place.push({ n, x: EXP_PAD + ci * (EXP_NW + EXP_GX), y: EXP_HEAD + colH[ci], w: EXP_NW, h })
    colH[ci] += h + EXP_GY
  }
  const used = Math.max(0, ...colH)
  return {
    place,
    w: EXP_PAD * 2 + cols * EXP_NW + (cols - 1) * EXP_GX,
    h: EXP_HEAD + Math.max(0, used - EXP_GY) + EXP_PAD,
    count: members.length,
  }
}
function planOverview (lanes, cols) {
  const gridW = cols * CARD_W + (cols - 1) * CARD_GX
  let W = gridW
  for (const ln of lanes) for (const ex of ln.exp) W = Math.max(W, ex.box.w)
  let y = 0
  const laneGeom = []
  for (const ln of lanes) {
    // продуктовый слой — «обложка» карты: его блоки шире и выше остальных
    const lcols = ln.big ? Math.max(1, Math.round(cols / 2)) : cols
    const cw = ln.big ? Math.round((gridW - (lcols - 1) * CARD_GX) / lcols) : CARD_W
    // высота продуктового блока — по числу возможностей внутри, без пустого низа
    const bigRows = ln.big ? Math.min(4, Math.max(1, ...ln.col.map(g => (g.members || []).length || 1))) : 0
    const ch = ln.big ? Math.min(CARD_H_BIG, 104 + 19 * bigRows) : CARD_H
    const top = y
    let cy = y + TIER_LABEL
    const items = []
    for (const ex of ln.exp) {
      items.push({ kind: 'exp', ref: ex, x: 0, y: cy, w: ex.box.w, h: ex.box.h })
      cy += ex.box.h + CARD_GY
    }
    const cells = ln.col.concat(ln.more ? [ln.more] : [])
    // одиночный неполный ряд центрируем — иначе разрежённый слой «прилипает» к левому краю
    const rowW = n => n * cw + (n - 1) * CARD_GX
    const off = cells.length < lcols ? Math.round((gridW - rowW(cells.length)) / 2) : 0
    cells.forEach((c, i) => {
      const r = Math.floor(i / lcols)
      const cc = i % lcols
      items.push({ kind: 'card', ref: c, x: off + cc * (cw + CARD_GX), y: cy + r * (ch + CARD_GY), w: cw, h: ch, big: !!ln.big })
    })
    const rows = Math.ceil(cells.length / lcols)
    if (rows) cy += rows * (ch + CARD_GY) - CARD_GY
    else if (ln.exp.length) cy -= CARD_GY
    laneGeom.push({ ln, top, bottom: cy, items })
    y = cy + TIER_GAP
  }
  const H = Math.max(1, y - TIER_GAP)
  return { W, H, cols, laneGeom }
}
function buildLanes () {
  const lanes = []
  for (const l of layers) {
    if (hiddenLayers.has(l.id)) continue
    const list = groups.filter(g => g.layer === l.id && (inferredOn() || !g.inferred))
    if (!list.length) continue
    list.sort((a, b) => (b.size - a.size) || a.label.localeCompare(b.label))
    const exp = []
    const col = []
    for (const g of list) (expanded.has(g.id) ? exp : col).push(g)
    for (const g of exp) g.box = expandedBox(g)
    let more = null
    if (!laneOpen.has(l.id) && col.length > LANE_CAP + 1) {
      const hid = col.slice(LANE_CAP)
      more = {
        id: 'more:' + l.id,
        layer: l.id,
        isMore: true,
        hidden: hid,
        count: hid.length,
        nodes: hid.reduce((acc, g) => acc + g.size, 0),
      }
      col.length = LANE_CAP
    }
    lanes.push({
      l,
      exp,
      col,
      more,
      big: productLayerIds.has(l.id),

    const g = s('g', { class: 'gelabelw', transform: `translate(${(pt.x - w / 2).toFixed(1)},${(pt.y - 11).toFixed(1)})` })
    g.append(s('rect', { class: 'geplate', width: w, height: 22, rx: 7, stroke: color, 'stroke-opacity': .55 }))
    const t = st(w / 2, 15, text, 'gelabel', color)

    const tip = s('title')
    tip.textContent = edgeWhy(f.kind)

  // границы для fit

    minX = Math.min(minX, -TIER_PADX); maxX = Math.max(maxX, W + TIER_PADX)

}

/* ── видимость: слои + inferred (детальный режим) ── */
function nodeVisible (n) {

}
function applyVisibility () {

/* ── pan / zoom / fit через viewBox ── */
const vb = { x: 0, y: 0, w: 1000, h: 600 }
let baseW = 1000
function updateVB () {
  svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`)
  updateMinimapView()
  const lvl = document.getElementById('zoomlvl')
  if (lvl && baseW > 0) lvl.textContent = Math.round(baseW / vb.w * 100) + '%'
}
function fitBox (minX, minY, maxX, maxY, pad) {
  if (!(minX < maxX) || !(minY < maxY)) { minX = 0; minY = 0; maxX = 1000; maxY = 600 }
  pad = pad ?? 60
  let w = maxX - minX + pad * 2
  let h = maxY - minY + pad * 2
  const ar = viewAspect()
  if (w / h > ar) h = w / ar
  else w = h * ar
  vb.x = (minX + maxX) / 2 - w / 2
  vb.y = (minY + maxY) / 2 - h / 2
  vb.w = w
  vb.h = h
  updateVB()
}
function contentBounds () {
  if (mode === 'overview') return ovBounds || { minX: 0, minY: 0, maxX: 1000, maxY: 600 }
  let minX = Infinity; let minY = Infinity; let maxX = -Infinity; let maxY = -Infinity
  for (const n of nodes) {
    if (!nodeVisible(n)) continue
    const p = posD.get(n.id)
    if (!p) continue
    minX = Math.min(minX, p.x); minY = Math.min(minY, p.y)
    maxX = Math.max(maxX, p.x + p.w); maxY = Math.max(maxY, p.y + p.h)
  }
  if (!(minX < maxX)) return { minX: 0, minY: 0, maxX: 1000, maxY: 600 }
  return { minX, minY: minY - LANE_PAD, maxX, maxY }
}
function fit () {
  const b = contentBounds()
  fitBox(b.minX, b.minY, b.maxX, b.maxY, mode === 'overview' ? 70 : 60)
  baseW = vb.w
  updateVB()
}
function zoomBy (k) {
  const cx = vb.x + vb.w / 2
  const cy = vb.y + vb.h / 2
  vb.w *= k
  vb.h *= k
  vb.x = cx - vb.w / 2
  vb.y = cy - vb.h / 2
  updateVB()
}
svg.addEventListener('wheel', e => {
  e.preventDefault()
  const k = e.deltaY > 0 ? 1.12 : 1 / 1.12
  const r = svg.getBoundingClientRect()
  const mx = vb.x + (e.clientX - r.left) / r.width * vb.w
  const my = vb.y + (e.clientY - r.top) / r.height * vb.h
  vb.x = mx - (mx - vb.x) * k
  vb.y = my - (my - vb.y) * k
  vb.w *= k
  vb.h *= k
  updateVB()
}, { passive: false })
let drag = null
let dragMoved = false
svg.addEventListener('pointerdown', e => {
  if (e.target.closest && e.target.closest('g.node,g.gcard,g.gexp')) return
  drag = { sx: e.clientX, sy: e.clientY, vx: vb.x, vy: vb.y }
  dragMoved = false
  svg.classList.add('panning')
  svg.setPointerCapture(e.pointerId)
})
svg.addEventListener('pointermove', e => {
  if (!drag) return
  const r = svg.getBoundingClientRect()
  const dx = (e.clientX - drag.sx) * vb.w / r.width
  const dy = (e.clientY - drag.sy) * vb.h / r.height
  if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 3) dragMoved = true
  vb.x = drag.vx - dx
  vb.y = drag.vy - dy
  updateVB()
})
svg.addEventListener('pointerup', () => { drag = null; svg.classList.remove('panning') })
function posFor (id) { return mode === 'overview' ? posO.get(id) : posD.get(id) }
function centerOn (id) {
  const p = posFor(id)
  if (!p) return
  vb.x = p.x + p.w / 2 - vb.w / 2
  vb.y = p.y + p.h / 2 - vb.h / 2
  updateVB()
}
function fitOn (id) {
  const p = posFor(id)
  if (!p) return
  fitBox(p.x, p.y, p.x + p.w, p.y + p.h, 90)
}

/* ── trace (BFS, циклы безопасны — visited) ── */
let traceActive = false
function traceSets (startId, direction) {
  const adjacency = direction === 'down' ? fwd : back
  const visited = new Set([startId])
  const pathEdges = new Set()
  const queue = [startId]
  let qi = 0
  while (qi < queue.length) {
    const current = queue[qi++]
    for (const e of adjacency.get(current) || []) {
      pathEdges.add(e.id)
      const next = direction === 'down' ? e.to : e.from
      if (!visited.has(next)) {
        visited.add(next)
        queue.push(next)
      }
    }
  }
  return { visited, pathEdges }
}
function runTrace (startId, direction) {
  const { visited, pathEdges } = traceSets(startId, direction)
  traceActive = true
  if (mode === 'details') {
    for (const n of nodes) {
      const g = dNodeEls.get(n.id)
      if (g) g.classList.toggle('dimmed', !visited.has(n.id))
    }
    for (const e of edges) {
      const p = dEdgeEls.get(e.id)
      if (!p) continue
      p.classList.toggle('traced', pathEdges.has(e.id))
      p.classList.toggle('dimmed', !pathEdges.has(e.id))
    }
    toast(`${direction === 'down' ? 'Вниз' : 'Вверх'}: ${visited.size - 1} связанных узлов`)
    return
  }
  const anchors = new Set()
  for (const id of visited) {
    const a = anchorOfNode(id)
    if (a) anchors.add(a)
  }
  for (const [id, g] of oCardEls) g.classList.toggle('dimmed', !anchors.has(id))
  for (const [id, g] of oNodeEls) g.classList.toggle('dimmed', !visited.has(id))
  for (const f of oEdgeEls) {
    const hit = [...f.eids].some(id => pathEdges.has(id))
    f.el.classList.toggle('traced', hit)
    f.el.classList.toggle('dimmed', !hit)
  }
  toast(`${direction === 'down' ? 'Вниз' : 'Вверх'}: ${visited.size - 1} связанных узлов`)
}
function runGroupTrace (startId, direction) {
  const adjacency = direction === 'down' ? gfwd : gback
  const visited = new Set([startId])
  const queue = [startId]
  let qi = 0
  const pairs = new Set()
  while (qi < queue.length) {
    const cur = queue[qi++]
    for (const e of adjacency.get(cur) || []) {
      pairs.add(e.from + '|' + e.to)
      const next = direction === 'down' ? e.to : e.from
      if (!visited.has(next)) { visited.add(next); queue.push(next) }
    }
  }
  traceActive = true
  const anchors = new Set()
  for (const gid of visited) { const a = anchorOfGroup(gid); if (a) anchors.add(a) }
  for (const [id, g] of oCardEls) g.classList.toggle('dimmed', !anchors.has(id))
  for (const [id, g] of oNodeEls) {
    const gid = groupOf.get(id)
    g.classList.toggle('dimmed', !visited.has(gid))
  }
  for (const f of oEdgeEls) {
    let hit = false
    for (const a of f.gf) { for (const b of f.gt) { if (pairs.has(a + '|' + b)) { hit = true; break } } if (hit) break }
    f.el.classList.toggle('traced', hit)
    f.el.classList.toggle('dimmed', !hit)
  }
  toast(`${direction === 'down' ? 'Вниз' : 'Вверх'}: ${visited.size - 1} связанных блоков`)
}
function clearTrace () {
  if (!traceActive) return
  traceActive = false
  for (const g of dNodeEls.values()) g.classList.remove('dimmed')
  for (const p of dEdgeEls.values()) p.classList.remove('dimmed', 'traced')
  for (const g of oCardEls.values()) g.classList.remove('dimmed')
  for (const g of oNodeEls.values()) g.classList.remove('dimmed')
  for (const f of oEdgeEls) f.el.classList.remove('dimmed', 'traced')
}

const history = []

}

let mmBounds = null
let minimapOn = true
function renderMinimap () {
  mmSvg.replaceChildren()

  if (!minimapOn || mmWrap.hidden) return
  const b = contentBounds()
  const w = Math.max(1, b.maxX - b.minX)
  const h = Math.max(1, b.maxY - b.minY)
  mmBounds = b
  mmSvg.setAttribute('viewBox', `${b.minX} ${b.minY} ${w} ${h}`)
  const gg = s('g')
  if (mode === 'overview') {
    for (const box of ovBoxes) {
      gg.append(s('rect', {
        x: box.x, y: box.y, width: box.w, height: box.h, rx: Math.min(10, box.w / 12),
        fill: layerColor(box.layer), 'fill-opacity': .55,
      }))
    }
  } else {
    for (const n of nodes) {
      if (!nodeVisible(n)) continue
      const p = posD.get(n.id)

      gg.append(s('rect', { x: p.x, y: p.y, width: p.w, height: p.h, fill: layerColor(n.layer), 'fill-opacity': .5 }))
    }
  }
  mmSvg.append(gg)

  mmSvg.append(mmView)

}
function updateMinimapView () {
  if (!mmView) return
  mmView.setAttribute('x', vb.x)
  mmView.setAttribute('y', vb.y)
  mmView.setAttribute('width', Math.max(1, vb.w))
  mmView.setAttribute('height', Math.max(1, vb.h))
}
function mmGoto (e) {
  if (!mmBounds) return
  const r = mmSvg.getBoundingClientRect()
  const w = mmBounds.maxX - mmBounds.minX
  const h = mmBounds.maxY - mmBounds.minY
  // preserveAspectRatio="xMidYMid meet": содержимое вписано с полями
  const scale = Math.min(r.width / w, r.height / h)
  const offX = (r.width - w * scale) / 2
  const offY = (r.height - h * scale) / 2
  const x = mmBounds.minX + (e.clientX - r.left - offX) / scale
  const y = mmBounds.minY + (e.clientY - r.top - offY) / scale
  vb.x = x - vb.w / 2
  vb.y = y - vb.h / 2
  updateVB()
}

const search = document.getElementById('search')
function matchesQuery (n, q) {
  return n.label.toLowerCase().includes(q) || n.id.toLowerCase().includes(q) ||
    ((n.source && n.source.file) || '').toLowerCase().includes(q)
}
function matchesGroup (g, q) {
  return g.label.toLowerCase().includes(q) || g.id.toLowerCase().includes(q) ||
    ((g.source && g.source.file) || '').toLowerCase().includes(q)
}
function applyQuery () {
  const q = search.value.trim().toLowerCase()
  if (mode === 'details') {
    for (const n of nodes) {
      const g = dNodeEls.get(n.id)
      if (g) g.classList.toggle('matched', !!q && matchesQuery(n, q))
    }
    return
  }
  const withMatch = new Set()
  if (q) {
    for (const n of nodes) {
      if (!matchesQuery(n, q)) continue
      const gid = groupOf.get(n.id)
      if (gid) withMatch.add(gid)
    }
  }
  for (const [id, g] of oCardEls) {
    const grp = groupById.get(id)
    g.classList.toggle('matched', !!q && !!grp && matchesGroup(grp, q))
    g.classList.toggle('hasmatch', !!q && !!grp && !matchesGroup(grp, q) && withMatch.has(id))
  }
  for (const [id, g] of oNodeEls) {
    const n = nodeById.get(id)
    g.classList.toggle('matched', !!q && !!n && matchesQuery(n, q))
  }
}
search.addEventListener('input', () => { applyQuery(); updateEmptyState() })
search.addEventListener('keydown', e => {
  if (e.key === 'Escape') { search.value = ''; applyQuery(); updateEmptyState(); search.blur(); return }
  if (e.key !== 'Enter') return
  const q = search.value.trim().toLowerCase()
  if (!q) return
  if (mode === 'overview') {
    const grp = groups.find(g => groupVisible(g) && matchesGroup(g, q))
    if (grp) { selectGroup(grp.id, true); return }
    const n = nodes.find(nn => nodeVisible(nn) && matchesQuery(nn, q))
    if (!n) { toast('Ничего не найдено'); return }
    selectNode(n.id, true)
    const p = posO.get(n.id)
    if (p) fitBox(p.x - 420, p.y - 280, p.x + p.w + 420, p.y + p.h + 280, 0)
    return
  }
  const first = nodes.find(n => nodeVisible(n) && matchesQuery(n, q))
  if (first) { selectNode(first.id, true); centerOn(first.id) } else toast('Ничего не найдено')
})

/* ── экспорт: SVG и PNG без внешних библиотек ── */
const SVG_VARS = ['--text', '--muted', '--faint', '--line', '--line2', '--frame', '--plate', '--exp',
  '--card-mid', '--card-low', '--grid', '--grid-op', '--btn', '--accent', '--bg', '--mono', '--sans']
function collectCss () {
  let out = ''
  for (const sheet of document.styleSheets) {
    let rules = null
    try { rules = sheet.cssRules } catch (err) { rules = null }
    if (!rules) continue
    for (const rule of rules) {
      const text = rule.cssText || ''
      // печатные и оверлейные правила экспортируемой картинке не нужны
      if (/^@(media print|page)/.test(text)) continue
      out += text + '\n'
    }
  }
  return out
}
function exportSvgText () {
  const clone = svg.cloneNode(true)
  const b = contentBounds()
  const pad = 40
  const w = Math.round(b.maxX - b.minX + pad * 2)
  const h = Math.round(b.maxY - b.minY + pad * 2)
  clone.setAttribute('viewBox', `${Math.round(b.minX - pad)} ${Math.round(b.minY - pad)} ${w} ${h}`)
  clone.setAttribute('width', w)
  clone.setAttribute('height', h)
  clone.removeAttribute('id')
  clone.setAttribute('xmlns', SVGNS)
  clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink')
  const cs = getComputedStyle(document.documentElement)
  let vars = ''
  for (const name of SVG_VARS) vars += `${name}:${cs.getPropertyValue(name).trim()};`
  const style = document.createElementNS(SVGNS, 'style')
  style.textContent = `svg{${vars}background:var(--bg)}\n` + collectCss()
  const bg = document.createElementNS(SVGNS, 'rect')
  bg.setAttribute('x', Math.round(b.minX - pad))
  bg.setAttribute('y', Math.round(b.minY - pad))
  bg.setAttribute('width', w)
  bg.setAttribute('height', h)
  bg.setAttribute('fill', cs.getPropertyValue('--bg').trim() || '#0b1120')
  clone.insertBefore(bg, clone.firstChild)
  clone.insertBefore(style, clone.firstChild)
  return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone)
}
function fileBase () {
  const t = (document.getElementById('title').textContent || 'archmap').trim().replace(/[^\w.-]+/g, '-')
  return `${t || 'archmap'}-${mode}`
}
function downloadBlob (blob, name) {
  const url = URL.createObjectURL(blob)
  const a = document.createElement('a')
  a.href = url
  a.download = name
  document.body.append(a)
  a.click()
  a.remove()
  setTimeout(() => URL.revokeObjectURL(url), 4000)
}
function exportSvg () {
  try {
    downloadBlob(new Blob([exportSvgText()], { type: 'image/svg+xml;charset=utf-8' }), fileBase() + '.svg')
    toast('SVG сохранён')
  } catch (err) {
    toast('Не удалось сохранить SVG: ' + (err && err.message ? err.message : err))
  }
}
function exportPng () {
  let text = ''
  try { text = exportSvgText() } catch (err) { toast('Не удалось подготовить картинку'); return }
  const img = new Image()
  img.onload = () => {
    try {
      const scale = Math.min(2, 4200 / Math.max(1, img.width))
      const canvas = document.createElement('canvas')
      canvas.width = Math.max(1, Math.round(img.width * scale))
      canvas.height = Math.max(1, Math.round(img.height * scale))
      const ctx = canvas.getContext('2d')
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#0b1120'
      ctx.fillRect(0, 0, canvas.width, canvas.height)
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height)
      canvas.toBlob(blob => {
        if (!blob) { toast('Браузер не дал сохранить PNG — скачайте SVG'); return }
        downloadBlob(blob, fileBase() + '.png')
        toast('PNG сохранён')
      }, 'image/png')
    } catch (err) {
      toast('Браузер запретил экспорт PNG — скачайте SVG')
    }
  }
  img.onerror = () => toast('Браузер не смог отрисовать PNG — скачайте SVG')
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(text)
}

document.getElementById('pngBtn').addEventListener('click', exportPng)

function usesRank () {
  const score = new Map()
  for (const e of edges) {
    const target = nodeById.get(e.to)
    if (!target) continue
    if (target.kind !== 'tech' && target.kind !== 'external-service' && target.kind !== 'mcp-server') continue
    if (e.kind !== 'uses' && e.kind !== 'import' && e.kind !== 'calls') continue
    score.set(e.to, (score.get(e.to) || 0) + 1)
  }
  return [...score.entries()].sort((a, b) => b[1] - a[1]).map(([id, n]) => ({ node: nodeById.get(id), n }))
}
function featureRank () {
  const feats = nodes.filter(n => PRODUCT_KINDS.has(n.kind))
  return feats.map(n => ({ node: n, n: (fwd.get(n.id) || []).length + (back.get(n.id) || []).length }))
    .sort((a, b) => b.n - a.n)
}
function topList (items, unit, onPick) {

}
function buildAbout () {

  // ── счётчики

  }
  const featCount = kc('feature') + kc('capability')
  if (featCount) tile(featCount, 'фич', true)
  tile(stats.nodes ?? nodes.length, 'узлов')
  tile(stats.edges ?? edges.length, 'связей')
  if (HAS_GROUPS) tile(groups.length, 'блоков')
  if (HAS_GROUPS) tile(groupEdges.length, 'потоков')
  if (kc('route') + kc('webhook') + kc('ws')) tile(kc('route') + kc('webhook') + kc('ws'), 'роутов')
  if (kc('table')) tile(kc('table'), 'таблиц')
  // каждая плитка считает ровно свою сущность: смешивать агентов со скиллами
  // и командами нельзя — «186 агентов» вместо 21 читается как ошибка данных
  if (kc('agent')) tile(kc('agent'), 'агентов')
  if (kc('skill')) tile(kc('skill'), 'скиллов')
  if (kc('command')) tile(kc('command'), 'команд')
  if (kc('mcp-server')) tile(kc('mcp-server'), 'MCP-серверов')
  if (kc('tech')) tile(kc('tech'), 'библиотек')
  if (kc('external-service')) tile(kc('external-service'), 'внешних систем')
  if (kc('test-suite')) tile(kc('test-suite'), 'тестов')
  if (kc('container') + kc('ci-pipeline')) tile(kc('container') + kc('ci-pipeline'), 'деплой')
  if (kc('env')) tile(kc('env'), 'env-переменных')
  body.append(tiles)

  // ── стеки
  const stacks = data.stacks || {}
  const detected = Array.isArray(stacks.detected) ? stacks.detected : []
  const cols = el('div', 'cols')
  if (detected.length) {
    const sec = el('div', 'sec')
    sec.append(el('h3', '', 'Стек'))
    const list = el('div', 'stacklist')
    for (const name of detected) {
      const ev = (stacks.evidence || {})[name] || {}
      const pill = el('span', 'stackpill', name)
      const hint = ev.dep || ev.file || ev.script || ''
      if (hint) pill.append(el('em', '', String(hint)))
      pill.title = hint ? `${name} — найдено: ${hint}` : name
      list.append(pill)
    }
    if (stacks.parser) {
      const pill = el('span', 'stackpill', 'parser')
      pill.append(el('em', '', String(stacks.parser) + (stacks.tsVersion ? ' ' + stacks.tsVersion : '')))
      list.append(pill)
    }
    sec.append(list)
    body.append(sec)
  }

  // ── топ фич и технологий
  const feats = featureRank().slice(0, 5)
  if (feats.length) {
    const sec = el('div', 'sec')
    sec.append(el('h3', '', 'Ключевые возможности'))
    sec.append(topList(feats, 'связей', n => selectNode(n.id)))
    cols.append(sec)
  }
  const tech = usesRank().slice(0, 5)
  if (tech.length) {
    const sec = el('div', 'sec')
    sec.append(el('h3', '', 'Чаще всего используется'))
    sec.append(topList(tech, 'исп.', n => selectNode(n.id)))
    cols.append(sec)
  }
  // ── находки
  const findings = []
  const cycleNodes = nodes.filter(n => n.meta && n.meta.cycle)
  const cycleCount = stats.cycles || (cycleNodes.length ? 1 : 0)
  if (cycleCount) findings.push(['bad', `Циклы импортов: ${cycleCount}`, cycleNodes.length ? `затронуто ${cycleNodes.length} модулей` : 'см. модули с пометкой cycle'])
  if (inferredTotal) findings.push(['warn', `Выведено эвристикой: ${inferredTotal}`, 'рисуется пунктиром — стоит проверить вручную'])
  if (stats.truncated) findings.push(['warn', 'Карта усечена', 'часть узлов не показана: репозиторий больше лимита сканера'])
  if (stats.collapsedModules) findings.push(['ok', 'Модули свёрнуты по каталогам', 'иначе граф импортов нечитаем'])
  if (stats.conflicts) findings.push(['warn', `Конфликты данных: ${stats.conflicts}`, 'один и тот же элемент описан по-разному'])
  if (stats.stubs) findings.push(['warn', `Заглушки: ${stats.stubs}`, 'ссылки на элементы, которых нет в коде'])
  if (stats.validationErrors) findings.push(['bad', `Ошибки валидации: ${stats.validationErrors}`, 'проверьте architecture.json'])
  if (!findings.length) findings.push(['ok', 'Явных проблем не найдено', 'ни циклов, ни усечения, ни конфликтов'])
  {
    const sec = el('div', 'sec')
    sec.append(el('h3', '', 'Находки'))
    const ul = el('ul', 'findings')
    for (const [level, title, note] of findings) {
      const li = el('li')
      const dot = el('span', 'fi')
      dot.style.background = level === 'bad' ? 'var(--bad)' : (level === 'warn' ? 'var(--warn)' : 'var(--ok)')
      const text = el('span')
      text.append(el('b', '', title), document.createTextNode(' — ' + note))
      li.append(dot, text)
      ul.append(li)
    }
    sec.append(ul)
    cols.append(sec)
  }
  body.append(cols)
}
function openAbout () { buildAbout(); aboutEl.hidden = false }
function closeAbout () { aboutEl.hidden = true }
document.getElementById('aboutBtn').addEventListener('click', openAbout)
document.getElementById('abX').addEventListener('click', closeAbout)
document.getElementById('abGo').addEventListener('click', closeAbout)
document.getElementById('abKeys').addEventListener('click', () => { closeAbout(); openKeys() })
aboutEl.addEventListener('click', e => { if (e.target === aboutEl) closeAbout() })

/* ── горячие клавиши ── */
const HOTKEYS = [
  ['O', 'режим «Обзор»'], ['D', 'режим «Детали»'], ['F', 'вписать карту в экран'],
  ['/', 'фокус в поиск'], ['Esc', 'сбросить выделение и панели'], ['E', 'развернуть выбранный блок'],
  ['C', 'свернуть все блоки'], ['1…9', 'вкл/выкл слой по номеру'], ['M', 'мини-карта'],
  ['T', 'светлая / тёмная тема'], ['P', 'печать или PDF'], ['I', 'панель «О проекте»'],
  ['?', 'эта подсказка'], ['Alt+←/→', 'назад / вперёд по выделениям'],
]
function buildKeys () {
  const box = document.getElementById('keysBody')
  box.replaceChildren()
  for (const [k, v] of HOTKEYS) {
    const row = el('div')
    row.append(el('kbd', '', k), el('span', '', v))
    box.append(row)
  }
}
function openKeys () { buildKeys(); keysEl.hidden = false }
function closeKeys () { keysEl.hidden = true }
document.getElementById('keysBtn').addEventListener('click', openKeys)
document.getElementById('kX').addEventListener('click', closeKeys)
keysEl.addEventListener('click', e => { if (e.target === keysEl) closeKeys() })

document.addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName || '').toLowerCase()
  const typing = tag === 'input' || tag === 'textarea' || (e.target && e.target.isContentEditable)
  if (e.key === 'Escape') {
    if (!keysEl.hidden) { closeKeys(); return }
    if (!aboutEl.hidden) { closeAbout(); return }
    if (typing) return
    clearSelection()
    return
  }
  if (typing || e.metaKey || e.ctrlKey) return
  if (e.altKey) {
    if (e.key === 'ArrowLeft') { e.preventDefault(); goHistory(-1) }
    if (e.key === 'ArrowRight') { e.preventDefault(); goHistory(1) }
    return
  }
  const k = e.key
  if (k === '/') { e.preventDefault(); search.focus(); search.select(); return }
  if (k === '?') { e.preventDefault(); if (keysEl.hidden) openKeys(); else closeKeys(); return }
  if (/^[1-9]$/.test(k)) {
    const l = layers[Number(k) - 1]
    if (l) { e.preventDefault(); toggleLayer(l.id) }
    return
  }
  const low = k.toLowerCase()
  if (low === 'o') { setMode('overview'); return }
  if (low === 'd') { setMode('details'); return }
  if (low === 'f') { fit(); return }
  if (low === 'm') { setMinimap(!minimapOn); return }
  if (low === 't') { toggleTheme(); return }
  if (low === 'i') { if (aboutEl.hidden) openAbout(); else closeAbout(); return }
  if (low === 'p') { e.preventDefault(); window.print(); return }
  if (low === 'c') { collapseBtn.click(); return }
  if (low === 'e') {
    if (!selected) { toast('Сначала выберите блок'); return }
    const gid = selected.type === 'group' ? selected.id : groupOf.get(selected.id)
    if (gid) toggleExpand(gid)
  }
})

/* печатаем всегда в светлой теме — неон на бумаге нечитаем */
let printRestore = null
window.addEventListener('beforeprint', () => {
  printRestore = { theme, vb: { x: vb.x, y: vb.y, w: vb.w, h: vb.h } }
  if (theme !== 'light') applyTheme('light')
  // на бумаге пропорции страницы другие — отдаём точные границы содержимого,
  // preserveAspectRatio сам впишет карту в лист без лишних полей
  const b = contentBounds()
  vb.x = b.minX - 30
  vb.y = b.minY - 30
  vb.w = Math.max(1, b.maxX - b.minX + 60)
  vb.h = Math.max(1, b.maxY - b.minY + 60)
  updateVB()
})
window.addEventListener('afterprint', () => {
  if (!printRestore) return
  if (printRestore.theme !== theme) applyTheme(printRestore.theme)
  Object.assign(vb, printRestore.vb)
  updateVB()
  printRestore = null
})

/* ── старт ── */
modeSeg.hidden = !HAS_GROUPS
setMode(HAS_GROUPS ? 'overview' : 'details')
setMinimap(true)
renderCrumbs()
updateHist()
openAbout()
let resizeTimer = null
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer)
  resizeTimer = setTimeout(() => { if (!traceActive) { fit(); renderMinimap() } }, 120)
})
/* хук для e2e-проверок раскладки (никаких данных наружу не отдаём) */
window.__archmap = {
  setMode, toggleExpand, selectGroup, selectNode, fit, fitOn, expanded, laneOpen, groups, search,
  openAbout, closeAbout, openKeys, closeKeys, applyTheme, setMinimap, exportSvgText, toggleLayer,
  runTrace, runGroupTrace, clearTrace, goHistory, get mode () { return mode }, get theme () { return theme },
}
</script>
