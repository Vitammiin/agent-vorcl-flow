<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__ARCHMAP_TITLE__ · archmap</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#0b1120;--panel:#111a2e;--panel2:#0e1526;--line:#1e2a44;--line2:#27365a;
    --text:#e8eefc;--muted:#8b9bb4;--faint:#5c6b85;
    --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 var(--sans);display:flex;flex-direction:column;overflow:hidden}

  /* ── header ─────────────────────────────────────────────── */
  header{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:10px 16px;background:linear-gradient(180deg,#121b31,#0e1526);border-bottom:1px solid var(--line);z-index:3}
  .brand{display:flex;flex-direction:column;margin-right:8px}
  .eyebrow{font:700 9px/1 var(--mono);letter-spacing:.28em;color:#55e6d7;text-transform:uppercase}
  h1{margin:2px 0 0;font:700 17px/1.1 var(--mono);letter-spacing:-.02em}
  .counts{font:10.5px var(--mono);color:var(--muted);margin-right:auto;padding-left:12px;border-left:1px solid var(--line2);white-space:nowrap}
  .counts b{color:var(--text)}
  #search{background:#0a101f;border:1px solid var(--line2);border-radius:8px;color:var(--text);font:12px var(--mono);padding:7px 11px;width:220px;outline:none}
  #search:focus{border-color:#55e6d7;box-shadow:0 0 12px #55e6d733}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{--c:#94a3b8;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--c);color:var(--c);background:transparent;border-radius:999px;padding:5px 11px;font:700 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 10px color-mix(in srgb,var(--c) 28%,transparent),inset 0 0 8px color-mix(in srgb,var(--c) 12%,transparent);transition:opacity .15s,box-shadow .15s}
  .chip .dot{width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
  .chip.off{opacity:.32;box-shadow:none;border-color:var(--line2);filter:saturate(.3)}
  .chip:hover{opacity:1}
  .chip-sep{font:700 9px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:0 2px 0 10px;align-self:center}
  .flowchip{--c:#64748b;font-size:9.5px;padding:3px 8px}
  label.inf-toggle{display:inline-flex;align-items:center;gap:6px;font:10.5px var(--mono);color:var(--muted);border:1px dashed var(--line2);border-radius:999px;padding:5px 11px;cursor:pointer;user-select:none}
  label.inf-toggle input{accent-color:#a78bfa;margin:0}
  .btn{border:1px solid var(--line2);background:#151f36;color:var(--text);border-radius:8px;padding:7px 13px;font:600 11px var(--mono);cursor:pointer}
  .btn:hover{border-color:#55e6d7;box-shadow:0 0 10px #55e6d726}
  .btn[hidden]{display:none}
  /* сегмент-контрол «Обзор | Детали» */
  .seg{display:inline-flex;border:1px solid var(--line2);background:#0a101f;border-radius:9px;padding:2px;gap:2px}
  .seg[hidden]{display:none}
  .seg button{border:0;background:transparent;color:var(--muted);font:700 11px var(--mono);letter-spacing:.04em;padding:6px 14px;border-radius:7px;cursor:pointer}
  .seg button.on{background:linear-gradient(180deg,#1c2b4a,#16223b);color:#9ff3ea;box-shadow:0 0 12px #55e6d72e,inset 0 0 0 1px #55e6d740}
  .seg button:hover{color:var(--text)}

  /* ── main / canvas / details ────────────────────────────── */
  main{flex:1;display:flex;min-height:0;position:relative}
  #canvas{flex:1;min-width:0;display:block;cursor:grab;touch-action:none;background:
    radial-gradient(1100px 550px at 25% -12%,#16233f80 0,transparent 60%),
    radial-gradient(900px 520px at 92% 112%,#20173d80 0,transparent 55%),var(--bg)}
  #canvas.panning{cursor:grabbing}
  #details{width:400px;flex:none;background:var(--panel2);border-left:1px solid var(--line);overflow-y:auto;padding:16px;font-family:var(--sans)}
  #details[hidden]{display:none}
  #details .d-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  #details .kbadge{--c:#94a3b8;font:700 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--c);border:1px solid var(--c);border-radius:5px;padding:3px 7px;box-shadow:0 0 8px color-mix(in srgb,var(--c) 30%,transparent)}
  #details .d-inferred{font:700 9px var(--mono);letter-spacing:.1em;color:#c4b5fd;border:1px dashed #a78bfa;border-radius:5px;padding:3px 7px}
  #details h2{margin:2px 0 10px;font:700 15px/1.25 var(--sans);word-break:break-word}
  #details .src{display:flex;align-items:center;gap:8px;background:#0a101f;border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-bottom:12px}
  #details .src code{flex:1;font:10.5px var(--mono);color:#9fe8df;word-break:break-all}
  #details .copy{border:1px solid var(--line2);background:#151f36;color:var(--muted);border-radius:6px;font:10px var(--mono);padding:4px 8px;cursor:pointer;flex:none}
  #details .copy:hover{color:var(--text);border-color:#55e6d7}
  #details h3{margin:16px 0 6px;font:700 9.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
  /* длинные имена колонок и типов рвались по символам («organ izati on_id») —
     держим их одной строкой, а таблицу прокручиваем по горизонтали */
  #details .twrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
  #details table{width:100%;border-collapse:collapse;font:10.5px var(--mono)}
  #details td,#details th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
  #details td:first-child{max-width:190px;overflow:hidden;text-overflow:ellipsis}
  #details th{color:var(--faint);font-weight:600;font-size:9px;letter-spacing:.08em;text-transform:uppercase}
  #details td.flag{color:#f472b6;white-space:nowrap}
  #details .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font:10.5px var(--mono)}
  #details .kv b{color:var(--faint);font-weight:600}
  #details .kv span{color:var(--text);word-break:break-word}
  #details .rel{list-style:none;margin:0;padding:0}
  #details .rel li{display:flex;align-items:center;gap:7px;padding:5px 7px;border:1px solid var(--line);border-radius:7px;margin-bottom:5px;cursor:pointer;font:11px var(--sans)}
  #details .rel li:hover{border-color:#55e6d7;background:#101a30}
  #details .rel .ek{font:700 8.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:2px 5px;flex:none}
  #details .rel .en{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #details .rel .en small{color:var(--faint)}
  #details .rel .cnt{margin-left:auto;font:700 9.5px var(--mono);color:var(--faint);flex:none}
  #details .tracebar{display:flex;gap:6px;margin:12px 0 2px}
  #details .tracebar .btn{flex:1;padding:8px 6px}
  #details .empty{color:var(--faint);font:10.5px var(--mono)}
  #details .pills{display:flex;flex-wrap:wrap;gap:6px}
  #details .pill{--c:#94a3b8;font:700 10px var(--mono);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent);border-radius:999px;padding:4px 9px}

  /* ── footer ─────────────────────────────────────────────── */
  footer{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:7px 16px;border-top:1px solid var(--line);background:#0d1424;font:10px var(--mono);color:var(--muted);z-index:3}
  footer .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  footer .lg i{width:8px;height:8px;border-radius:2px;display:inline-block;box-shadow:0 0 6px currentColor}
  footer .lg.dash i{background:transparent!important;border:1px dashed var(--muted);box-shadow:none}
  footer .fcounts{margin-left:auto;color:var(--faint)}
  footer .hint{color:var(--faint)}

  /* ── svg graph ──────────────────────────────────────────── */
  text{font-family:var(--mono);user-select:none}
  .lane-bg{pointer-events:none}
  .lane-label{font-size:10px;font-weight:700;letter-spacing:.22em;pointer-events:none}
  .node{cursor:pointer}
  .frame{fill:#111a2ef5;stroke-width:1.2;transition:stroke-width .12s}
  .node.inf .frame{stroke-dasharray:5 4}
  .thead{pointer-events:none}
  .nlabel{fill:var(--text);font-size:11.5px;font-weight:600}
  .nkind{font-size:7.5px;font-weight:700;letter-spacing:.1em;opacity:.85}
  .nmut{fill:var(--muted);font-size:9px}
  .ncol{fill:#b7c3d8;font-size:10px}
  .ncol .cty{fill:var(--faint)}
  .nmore{fill:var(--faint);font-size:9px;font-style:italic}
  .nsep{stroke:var(--line2);stroke-width:1}
  .edge{fill:none;stroke-width:1.1;opacity:.5;pointer-events:stroke}
  .node.matched .frame{stroke-width:2.4}
  .hidden{display:none}
  .dimmed{opacity:.13;pointer-events:none}
  .edge.traced{stroke-dasharray:7 4;animation:dashflow .8s linear infinite;opacity:1;stroke-width:1.7}
  @keyframes dashflow{to{stroke-dashoffset:-22}}
  #emptymsg{fill:var(--faint);font-size:14px}

  /* ── overview: тир-полосы, блоки групп, потоки ──────────── */
  .tier-band{pointer-events:none}
  .tier-title{font-size:19px;font-weight:800;letter-spacing:.2em;pointer-events:none}
  .tier-sub{font-size:11px;fill:var(--faint);letter-spacing:.06em;pointer-events:none}
  .gcard{cursor:pointer}
  .gframe{stroke-width:1.5;transition:stroke-width .12s}
  .gcard.inf .gframe{stroke-dasharray:6 5}
  .gcard.more .gframe{stroke-dasharray:6 6;fill:#0d1524d9}
  .gtitle{font-family:var(--sans);font-size:16.5px;font-weight:700;fill:var(--text)}
  .gsub{font-size:11px;fill:var(--muted);letter-spacing:.02em}
  .gsrc{font-size:9.5px;fill:var(--faint)}
  .gnum{font-size:11px;font-weight:700;letter-spacing:.04em}
  .gbar-bg{fill:#ffffff14}
  .gicon{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  .ghead{pointer-events:none}
  .gplus{fill:none;stroke-width:1.3;opacity:.7}
  .gcard.matched .gframe{stroke-width:3.4}
  .gcard.hasmatch .gframe{stroke-width:2.6;stroke-dasharray:3 3}
  .gedge{fill:none;pointer-events:stroke;opacity:.92;transition:opacity .12s}
  .gedge:hover{opacity:1}
  .gedge.traced{stroke-dasharray:9 5;animation:dashflow .8s linear infinite;opacity:1}
  .gelabel{font-size:10.5px;font-weight:700;letter-spacing:.03em}
  .geplate{fill:#0b1120e8;stroke-width:1}
  .expframe{fill:#0a1020ea;stroke-width:1.6}
  .exphead{font-family:var(--sans);font-size:16px;font-weight:700;fill:var(--text)}
  .expsub{font-size:10.5px;fill:var(--muted)}
  .collapse-btn{cursor:pointer}
  .collapse-btn rect{fill:#16223b;stroke-width:1}
  .collapse-btn text{font-size:10.5px;font-weight:700;fill:var(--muted)}
  .collapse-btn:hover rect{stroke:#55e6d7}
  .collapse-btn:hover text{fill:var(--text)}
  .hit{fill:transparent}

  /* ── appendix (print only) ──────────────────────────────── */
  #appendix{display:none}

  /* ── print ──────────────────────────────────────────────── */
  @page{size:A3 landscape;margin:10mm}
  @media print{
    body{background:#fff;color:#0f172a;overflow:visible;display:block}
    header .controls,header #search,header .seg,#details,footer .fcounts,footer .hint{display:none!important}
    header{background:#fff;border-color:#cbd5e1}
    h1{color:#0f172a}.counts{color:#475569}.counts b{color:#0f172a}
    main{display:block}
    #canvas{background:#fff;width:100%;height:170mm}
    .gridbg{fill:#ffffff}
    .frame{fill:#ffffff}
    .nlabel{fill:#0f172a}.ncol{fill:#334155}.nmut,.nmore{fill:#64748b}
    .nsep{stroke:#cbd5e1}
    .gframe{fill:#ffffff}
    .gtitle,.exphead{fill:#0f172a}
    .gsub,.expsub{fill:#475569}.gsrc{fill:#64748b}
    .gbar-bg{fill:#e2e8f0}
    .expframe{fill:#ffffff}
    .geplate{fill:#ffffff;stroke:#cbd5e1}
    .tier-sub{fill:#64748b}
    .collapse-btn{display:none}
    #emptymsg{fill:#64748b}
    footer{background:#fff;border-color:#cbd5e1;color:#475569}
    #appendix{display:table;width:100%;margin-top:8mm;border-collapse:collapse;font:9px var(--mono);color:#0f172a;page-break-before:always}
    #appendix caption{text-align:left;font:700 12px var(--mono);padding:4px 0;color:#0f172a}
    #appendix th,#appendix td{border:1px solid #cbd5e1;padding:3px 6px;text-align:left;word-break:break-all}
    #appendix th{background:#f1f5f9}
  }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="eyebrow">archmap</span><h1 id="title">__ARCHMAP_TITLE__</h1></div>
  <div class="counts" id="counts"></div>
  <div class="seg" id="modeSeg" hidden>
    <button type="button" data-mode="overview">Обзор</button>
    <button type="button" data-mode="details">Детали</button>
  </div>
  <input id="search" type="search" placeholder="search: label / id / file  ⏎" spellcheck="false" autocomplete="off">
  <div class="controls" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <div class="chips" id="layerChips"></div>
    <label class="inf-toggle"><input type="checkbox" id="inferredToggle" checked> inferred</label>
    <button class="btn" id="collapseBtn" hidden>Свернуть всё</button>
    <button class="btn" id="fitBtn">Fit</button>
    <button class="btn" id="printBtn">Print</button>
  </div>
</header>
<main>
  <svg id="canvas" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
  <aside id="details" hidden></aside>
</main>
<footer><div id="legend" style="display:flex;gap:14px;flex-wrap:wrap"></div><div class="hint" id="hint"></div><div class="fcounts" id="fcounts"></div></footer>
<table id="appendix"></table>
<script id="archmap-data" type="application/json">__ARCHMAP_JSON__</script>
<script>
'use strict'
/* archmap interactive template — вся раскладка и интеракции на клиенте.
   Два режима:
     ОБЗОР  — только группы (data.groups) крупными блоками + агрегированные
              потоки (data.groupEdges); любой блок разворачивается в детальный
              рендер своих узлов прямо на месте.
     ДЕТАЛИ — исходная поузловая карта (все data.nodes/data.edges).
   layoutColumns/trace ниже — осознанная компактная копия scripts/lib/graph.mjs:
   браузер не может импортировать node-модули пайплайна. */
const data = JSON.parse(document.getElementById('archmap-data').textContent)
const FALLBACK_LAYERS = [
  { id: 'client', label: 'Client', color: '#38bdf8' },
  { id: 'api', label: 'API', color: '#34d399' },
  { id: 'agents', label: 'Agents', color: '#a78bfa' },
  { id: 'logic', label: 'Logic', color: '#fbbf24' },
  { id: 'data', label: 'Data', color: '#f472b6' },
  { id: 'infra', label: 'Infra', color: '#94a3b8' },
]
const layers = Array.isArray(data.layers) && data.layers.length ? data.layers : FALLBACK_LAYERS
const nodes = Array.isArray(data.nodes) ? data.nodes : []
const edges = Array.isArray(data.edges) ? data.edges : []
const nodeById = new Map(nodes.map(n => [n.id, n]))
const layerById = {}
for (const l of layers) layerById[l.id] = l
const layerColor = id => (layerById[id] || { color: '#94a3b8' }).color
const layerLabel = id => (layerById[id] || { label: id }).label

const METHOD_COLORS = { GET: '#34d399', POST: '#60a5fa', PUT: '#fbbf24', PATCH: '#a78bfa', DELETE: '#f87171' }
const NODE_W = 240
const GAP_X = 130
const GAP_Y = 26
const LANE_PAD = 52
const SUB_GAP_X = 26      // зазор между подколонками внутри одного лейна
const TARGET_H = 2400     // выше этого колонка переносится в следующую подколонку
const SVGNS = 'http://www.w3.org/2000/svg'

/* ── ОБЗОР: геометрия ─────────────────────────────────────── */
const CARD_W = 296
const CARD_H = 118
const CARD_GX = 26
const CARD_GY = 26
const TIER_LABEL = 58       // высота шапки тир-полосы
const TIER_GAP = 78         // зазор между слоями
const TIER_PADX = 26
const LANE_CAP = 12         // сколько блоков показываем в слое до «+N ещё»
const EXP_NW = 240          // ширина узла внутри развёрнутой группы
const EXP_GX = 22
const EXP_GY = 18
const EXP_PAD = 22
const EXP_HEAD = 54

/* ── группы (могут отсутствовать в старых architecture.json) ─ */
const groupOf = new Map()     // nodeId -> groupId
const groups = []
for (const raw of (Array.isArray(data.groups) ? data.groups : [])) {
  if (!raw || !raw.id) continue
  const members = (Array.isArray(raw.members) ? raw.members : []).filter(id => nodeById.has(id))
  const label = (raw.label && String(raw.label).trim()) || String(raw.id).split(':').pop() || raw.id
  const g = {
    id: raw.id,
    layer: layerById[raw.layer] ? raw.layer : 'infra',
    label,
    members,
    counts: (raw.counts && typeof raw.counts === 'object') ? raw.counts : {},
    size: typeof raw.size === 'number' ? raw.size : members.length,
    source: raw.source || null,
    inferred: !!raw.inferred,
  }
  groups.push(g)
  for (const m of members) if (!groupOf.has(m)) groupOf.set(m, g.id)
}
/* узлы вне групп не должны исчезать из обзора — собираем их в «Прочее» по слою */
if (groups.length) {
  const rest = new Map()
  for (const n of nodes) {
    if (groupOf.has(n.id)) continue
    if (!rest.has(n.layer)) rest.set(n.layer, [])
    rest.get(n.layer).push(n)
  }
  for (const [layer, list] of rest) {
    const g = {
      id: 'grp:__rest:' + layer,
      layer: layerById[layer] ? layer : 'infra',
      label: 'Прочее',
      members: list.map(n => n.id),
      counts: {},
      size: list.length,
      source: null,
      inferred: false,
      synthetic: true,
    }
    for (const n of list) { g.counts[n.kind] = (g.counts[n.kind] || 0) + 1; groupOf.set(n.id, g.id) }
    groups.push(g)
  }
}
const groupById = new Map(groups.map(g => [g.id, g]))
const HAS_GROUPS = groups.length > 0
const groupEdges = (Array.isArray(data.groupEdges) ? data.groupEdges : [])
  .filter(e => e && groupById.has(e.from) && groupById.has(e.to) && e.from !== e.to)

/* какие узловые рёбра стоят за парой групп — нужно для trace поверх потоков */
const pairEdges = new Map()
for (const e of edges) {
  const a = groupOf.get(e.from)
  const b = groupOf.get(e.to)
  if (!a || !b) continue
  const key = a + '␀' + b
  let arr = pairEdges.get(key)
  if (!arr) { arr = []; pairEdges.set(key, arr) }
  arr.push(e.id)
}

/* ── динамический CSS: hover/selected свечение цветом слоя ── */
{
  const safe = id => /^[a-z0-9-]+$/.test(id)
  let css = ''
  for (const l of layers) {
    if (!safe(l.id)) continue
    css += `.node[data-layer="${l.id}"]:hover .frame,.node[data-layer="${l.id}"].selected .frame{filter:url(#glow2-${l.id});stroke-width:2.4}\n`
    css += `.gcard[data-layer="${l.id}"]:hover .gframe,.gcard[data-layer="${l.id}"].selected .gframe{filter:url(#glow2-${l.id});stroke-width:3}\n`
  }
  const st = document.createElement('style')
  st.textContent = css
  document.head.append(st)
}

/* ── header: счётчики, чипы слоёв, легенда, appendix ──────── */
const stats = data.stats || {}
const inferredTotal = (stats.inferredNodes ?? nodes.filter(n => n.inferred).length) +
  (stats.inferredEdges ?? edges.filter(e => e.inferred).length)
function el (tag, cls, text) {
  const node = document.createElement(tag)
  if (cls) node.className = cls
  if (text !== undefined) node.textContent = text
  return node
}
{
  const c = document.getElementById('counts')
  const b1 = el('b', '', String(stats.nodes ?? nodes.length))
  const b2 = el('b', '', String(stats.edges ?? edges.length))
  const b3 = el('b', '', String(inferredTotal))
  c.append(b1, ' nodes · ', b2, ' edges · ', b3, ' inferred')
  if (HAS_GROUPS) {
    const b4 = el('b', '', String(groups.length))
    const b5 = el('b', '', String(groupEdges.length))
    c.append(' · ', b4, ' groups · ', b5, ' flows')
  }
  document.getElementById('fcounts').textContent =
    `${nodes.length} nodes · ${edges.length} edges · ${layers.length} layers` + (stats.truncated ? ' · truncated' : '')
  document.getElementById('hint').textContent = HAS_GROUPS

/* ── ДЕТАЛИ: колонки по слоям + barycenter (3 прохода) ────── */
const posD = new Map()
const dNodeEls = new Map()
const dEdgeEls = new Map()
let detailsBuilt = false
let detailCols = []
let detailMaxH = 0
function layoutDetails () {
  const cols = []
  for (const layer of layers) {
    const list = nodes.filter(n => n.layer === layer.id)
    if (list.length) cols.push({ layer, list })
  }
  const index = new Map()
  cols.forEach((col, ci) => {
    col.list.sort((a, b) => a.id.localeCompare(b.id))
    col.list.forEach((n, ri) => index.set(n.id, { ci, ri }))
  })
  const neigh = new Map()
  for (const e of edges) {
    if (!neigh.has(e.from)) neigh.set(e.from, [])
    if (!neigh.has(e.to)) neigh.set(e.to, [])
    neigh.get(e.from).push(e.to)
    neigh.get(e.to).push(e.from)
  }
  for (let pass = 0; pass < 3; pass++) {
    for (const col of cols) {
      const scored = col.list.map(n => {
        const rows = (neigh.get(n.id) || [])
          .map(id => { const i = index.get(id); return i && i.ri })
          .filter(r => r !== undefined && r !== false)
        const bary = rows.length ? rows.reduce((s, r) => s + r, 0) / rows.length : index.get(n.id).ri
        return { n, bary }
      })
      scored.sort((a, b) => a.bary - b.bary || a.n.id.localeCompare(b.n.id))
      scored.forEach((sc, ri) => { index.get(sc.n.id).ri = ri })
      col.list = scored.map(sc => sc.n)
    }
  }
  // Слой с сотнями узлов вытянулся бы в нечитаемую вертикальную нить,
  // поэтому длинная колонка переносится в несколько подколонок внутри своего лейна.
  let maxH = 0
  cols.forEach(col => {
    let total = 0
    for (const n of col.list) total += nodeHeight(n) + GAP_Y
    total = Math.max(0, total - GAP_Y)
    col.subCount = Math.max(1, Math.ceil(total / TARGET_H))
    col.height = col.subCount === 1 ? total : Math.min(TARGET_H, Math.ceil(total / col.subCount) + 120)
    col.width = col.subCount * NODE_W + (col.subCount - 1) * SUB_GAP_X
    maxH = Math.max(maxH, col.height)
  })
  let laneX = 0
  cols.forEach(col => {
    col.x = laneX
    const limit = col.subCount === 1 ? Infinity : col.height
    let sub = 0
    let y = LANE_PAD + (maxH - col.height) / 2
    const top = y
    for (const n of col.list) {
      const h = nodeHeight(n)
      if (y > top && y + h - top > limit && sub < col.subCount - 1) {
        sub++
        y = top
      }
      posD.set(n.id, { x: laneX + sub * (NODE_W + SUB_GAP_X), y, w: NODE_W, h, ci: cols.indexOf(col), sub })
      y += h + GAP_Y
    }
    laneX += col.width + GAP_X
  })
  detailCols = cols
  detailMaxH = maxH
}

/* рёбра детального режима: кубические Безье между колонками */
function edgePathD (a, b) {
  if (a.ci === b.ci && a.sub === b.sub) {
    const x = a.x + a.w
    const y1 = a.y + a.h / 2
    const y2 = b.y + b.h / 2
    return `M ${x} ${y1} C ${x + 72} ${y1} ${x + 72} ${y2} ${x} ${y2}`
  }
  const forward = b.x >= a.x
  const x1 = forward ? a.x + a.w : a.x
  const x2 = forward ? b.x : b.x + b.w
  const y1 = a.y + a.h / 2
  const y2 = b.y + b.h / 2
  const dx = Math.min(160, Math.max(40, Math.abs(b.ci - a.ci) * 40 + 40)) * (forward ? 1 : -1)
  return `M ${x1} ${y1} C ${x1 + dx} ${y1} ${x2 - dx} ${y2} ${x2} ${y2}`
}

    if (g) g.classList.toggle('hidden', !nodeVisible(n))
  }
  for (const e of edges) {
    const p = dEdgeEls.get(e.id)
    if (!p) continue
    const vis = nodeVisible(nodeById.get(e.from)) && nodeVisible(nodeById.get(e.to)) &&
      (inferredOn() || !e.inferred)
    p.classList.toggle('hidden', !vis)
  }
}

/* ── pan / zoom / fit через viewBox ───────────────────────── */
const vb = { x: 0, y: 0, w: 1000, h: 600 }
function updateVB () {
  svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`)
}
function fitBox (minX, minY, maxX, maxY, pad) {
  if (!(minX < maxX) || !(minY < maxY)) { minX = 0; minY = 0; maxX = 1000; maxY = 600 }
  pad = pad ?? 60
  let w = maxX - minX + pad * 2
  let h = maxY - minY + pad * 2
  const ar = viewAspect()
  if (w / h > ar) h = w / ar
  else w = h * ar
  vb.x = (minX + maxX) / 2 - w / 2
  vb.y = (minY + maxY) / 2 - h / 2
  vb.w = w
  vb.h = h
  updateVB()
}
function fit () {
  if (mode === 'overview') {
    const b = ovBounds || { minX: 0, minY: 0, maxX: 1000, maxY: 600 }
    fitBox(b.minX, b.minY, b.maxX, b.maxY, 70)
    return
  }
  let minX = Infinity; let minY = Infinity; let maxX = -Infinity; let maxY = -Infinity
  for (const n of nodes) {
    if (!nodeVisible(n)) continue
    const p = posD.get(n.id)
    if (!p) continue
    minX = Math.min(minX, p.x); minY = Math.min(minY, p.y)
    maxX = Math.max(maxX, p.x + p.w); maxY = Math.max(maxY, p.y + p.h)
  }
  fitBox(minX, minY - LANE_PAD, maxX, maxY, 60)
}
svg.addEventListener('wheel', e => {
  e.preventDefault()
  const k = e.deltaY > 0 ? 1.12 : 1 / 1.12
  const r = svg.getBoundingClientRect()
  const mx = vb.x + (e.clientX - r.left) / r.width * vb.w
  const my = vb.y + (e.clientY - r.top) / r.height * vb.h
  vb.x = mx - (mx - vb.x) * k
  vb.y = my - (my - vb.y) * k
  vb.w *= k
  vb.h *= k
  updateVB()
}, { passive: false })
let drag = null
let dragMoved = false
svg.addEventListener('pointerdown', e => {
  if (e.target.closest && e.target.closest('g.node,g.gcard,g.gexp')) return
  drag = { sx: e.clientX, sy: e.clientY, vx: vb.x, vy: vb.y }
  dragMoved = false
  svg.classList.add('panning')
  svg.setPointerCapture(e.pointerId)
})
svg.addEventListener('pointermove', e => {
  if (!drag) return
  const r = svg.getBoundingClientRect()
  const dx = (e.clientX - drag.sx) * vb.w / r.width
  const dy = (e.clientY - drag.sy) * vb.h / r.height
  if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 3) dragMoved = true
  vb.x = drag.vx - dx
  vb.y = drag.vy - dy
  updateVB()
})
svg.addEventListener('pointerup', () => { drag = null; svg.classList.remove('panning') })
function posFor (id) { return mode === 'overview' ? posO.get(id) : posD.get(id) }
function centerOn (id) {
  const p = posFor(id)
  if (!p) return
  vb.x = p.x + p.w / 2 - vb.w / 2
  vb.y = p.y + p.h / 2 - vb.h / 2
  updateVB()
}
function fitOn (id) {
  const p = posFor(id)
  if (!p) return
  fitBox(p.x, p.y, p.x + p.w, p.y + p.h, 90)
}

document.getElementById('printBtn').addEventListener('click', () => window.print())

/* ── trace (BFS, циклы безопасны — visited) ───────────────── */
let traceActive = false
function traceSets (startId, direction) {
  const adjacency = direction === 'down' ? fwd : back
  const visited = new Set([startId])
  const pathEdges = new Set()
  const queue = [startId]
  let qi = 0
  while (qi < queue.length) {
    const current = queue[qi++]
    for (const e of adjacency.get(current) || []) {
      pathEdges.add(e.id)
      const next = direction === 'down' ? e.to : e.from
      if (!visited.has(next)) {
        visited.add(next)
        queue.push(next)
      }
    }
  }
  return { visited, pathEdges }
}
function runTrace (startId, direction) {
  const { visited, pathEdges } = traceSets(startId, direction)
  traceActive = true
  if (mode === 'details') {
    for (const n of nodes) {
      const g = dNodeEls.get(n.id)
      if (g) g.classList.toggle('dimmed', !visited.has(n.id))
    }
    for (const e of edges) {
      const p = dEdgeEls.get(e.id)
      if (!p) continue
      p.classList.toggle('traced', pathEdges.has(e.id))
      p.classList.toggle('dimmed', !pathEdges.has(e.id))
    }
    return
  }
  const anchors = new Set()
  for (const id of visited) {
    const a = anchorOfNode(id)
    if (a) anchors.add(a)
  }
  for (const [id, g] of oCardEls) g.classList.toggle('dimmed', !anchors.has(id))
  for (const [id, g] of oNodeEls) g.classList.toggle('dimmed', !visited.has(id))
  for (const f of oEdgeEls) {
    const hit = [...f.eids].some(id => pathEdges.has(id))
    f.el.classList.toggle('traced', hit)
    f.el.classList.toggle('dimmed', !hit)
  }
}
function runGroupTrace (startId, direction) {
  const adjacency = direction === 'down' ? gfwd : gback
  const visited = new Set([startId])
  const queue = [startId]
  let qi = 0
  const pairs = new Set()
  while (qi < queue.length) {
    const cur = queue[qi++]
    for (const e of adjacency.get(cur) || []) {
      pairs.add(e.from + '|' + e.to)
      const next = direction === 'down' ? e.to : e.from
      if (!visited.has(next)) { visited.add(next); queue.push(next) }
    }
  }
  traceActive = true
  const anchors = new Set()
  for (const gid of visited) { const a = anchorOfGroup(gid); if (a) anchors.add(a) }
  for (const [id, g] of oCardEls) g.classList.toggle('dimmed', !anchors.has(id))
  for (const [id, g] of oNodeEls) {
    const gid = groupOf.get(id)
    g.classList.toggle('dimmed', !visited.has(gid))
  }
  for (const f of oEdgeEls) {
    let hit = false
    for (const a of f.gf) { for (const b of f.gt) { if (pairs.has(a + '|' + b)) { hit = true; break } } if (hit) break }
    f.el.classList.toggle('traced', hit)
    f.el.classList.toggle('dimmed', !hit)
  }
}
function clearTrace () {
  if (!traceActive) return
  traceActive = false
  for (const g of dNodeEls.values()) g.classList.remove('dimmed')
  for (const p of dEdgeEls.values()) p.classList.remove('dimmed', 'traced')
  for (const g of oCardEls.values()) g.classList.remove('dimmed')
  for (const g of oNodeEls.values()) g.classList.remove('dimmed')
  for (const f of oEdgeEls) f.el.classList.remove('dimmed', 'traced')
}

/* ── поиск ────────────────────────────────────────────────── */
const search = document.getElementById('search')
function matchesQuery (n, q) {
  return n.label.toLowerCase().includes(q) || n.id.toLowerCase().includes(q) ||
    ((n.source && n.source.file) || '').toLowerCase().includes(q)
}
function matchesGroup (g, q) {
  return g.label.toLowerCase().includes(q) || g.id.toLowerCase().includes(q) ||
    ((g.source && g.source.file) || '').toLowerCase().includes(q)
}
function applyQuery () {
  const q = search.value.trim().toLowerCase()
  if (mode === 'details') {
    for (const n of nodes) {
      const g = dNodeEls.get(n.id)
      if (g) g.classList.toggle('matched', !!q && matchesQuery(n, q))
    }
    return
  }
  const withMatch = new Set()
  if (q) {
    for (const n of nodes) {
      if (!matchesQuery(n, q)) continue
      const gid = groupOf.get(n.id)
      if (gid) withMatch.add(gid)
    }
  }
  for (const [id, g] of oCardEls) {
    const grp = groupById.get(id)
    g.classList.toggle('matched', !!q && !!grp && matchesGroup(grp, q))
    g.classList.toggle('hasmatch', !!q && !!grp && !matchesGroup(grp, q) && withMatch.has(id))
  }
  for (const [id, g] of oNodeEls) {
    const n = nodeById.get(id)
    g.classList.toggle('matched', !!q && !!n && matchesQuery(n, q))
  }
}
search.addEventListener('input', applyQuery)
search.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return
  const q = search.value.trim().toLowerCase()
  if (!q) return
  if (mode === 'overview') {
    const grp = groups.find(g => groupVisible(g) && matchesGroup(g, q))
    if (grp) { selectGroup(grp.id, true); return }
    const n = nodes.find(nn => nodeVisible(nn) && matchesQuery(nn, q))
    if (!n) return
    selectNode(n.id, true)
    const p = posO.get(n.id)
    if (p) fitBox(p.x - 420, p.y - 280, p.x + p.w + 420, p.y + p.h + 280, 0)
    return
  }
  const first = nodes.find(n => nodeVisible(n) && matchesQuery(n, q))
  if (first) centerOn(first.id)
})

/* ── старт ────────────────────────────────────────────────── */
modeSeg.hidden = !HAS_GROUPS
if (HAS_GROUPS) setMode('overview')
else { setMode('details') }
window.addEventListener('resize', () => { if (!traceActive) fit() })
/* хук для e2e-проверок раскладки (никаких данных наружу не отдаём) */
window.__archmap = { setMode, toggleExpand, selectGroup, selectNode, fit, fitOn, expanded, laneOpen, groups, search }
</script>
