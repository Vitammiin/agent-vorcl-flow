# Agent-Vorcl-Flow — конфиг для Codex CLI.
# Вставьте в ~/.codex/config.toml или примените scripts/install.sh.

# ===== MCP-серверы =====
[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
env = { GITHUB_PERSONAL_ACCESS_TOKEN = "" }   # впишите токен

[mcp_servers.filesystem]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "."]

[mcp_servers.postgres]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-postgres", "postgres://user:pass@localhost:5432/db"]  # впишите URL

[mcp_servers.redis]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-redis", "redis://localhost:6379"]

[mcp_servers.docker]
command = "npx"
args = ["-y", "mcp-server-docker"]

# Vercel — официальный удалённый MCP (Streamable HTTP + OAuth).
# Codex откроет браузер для авторизации при первом вызове.
[mcp_servers.vercel]
url = "https://mcp.vercel.com"

# ===== Профили под роли (codex --profile architect | backend) =====
[profiles.architect]
model_reasoning_effort = "high"
# model = "gpt-5.1-codex"   # при необходимости укажите модель

[profiles.backend]
model_reasoning_effort = "medium"
