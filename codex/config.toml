# Agent-Vorcl-Flow — конфиг для Codex CLI.
# Вставьте в ~/.codex/config.toml или примените scripts/install.sh.
#
# Секреты НЕ хранятся здесь. Каждый MCP-сервер запускается через launcher
# bin/mcp-env.mjs, который читает ключи из ~/.config/agent-vorcl-flow/.env
# (тот же файл для Claude/Cursor/Kimi). Установщик подставляет абсолютный путь
# launcher'а вместо __AVF_LAUNCHER__. Серверы без нужного ключа не поднимаются
# (в логах — понятная подсказка), остальные работают.

# ===== MCP-серверы =====
[mcp_servers.github]
command = "node"
args = ["__AVF_LAUNCHER__", "--need=GITHUB_PERSONAL_ACCESS_TOKEN", "--", "npx", "-y", "@modelcontextprotocol/server-github"]

[mcp_servers.filesystem]
command = "node"
args = ["__AVF_LAUNCHER__", "--", "npx", "-y", "@modelcontextprotocol/server-filesystem", "."]

[mcp_servers.postgres]
command = "node"
args = ["__AVF_LAUNCHER__", "--need=POSTGRES_URL", "--", "npx", "-y", "@modelcontextprotocol/server-postgres", "%%POSTGRES_URL%%"]

# MongoDB — официальный MCP-сервер. Для аудита добавьте аргумент "--readOnly".
[mcp_servers.mongodb]
command = "node"
args = ["__AVF_LAUNCHER__", "--need=MDB_MCP_CONNECTION_STRING", "--", "npx", "-y", "mongodb-mcp-server@latest"]

[mcp_servers.redis]
command = "node"
args = ["__AVF_LAUNCHER__", "--need=REDIS_URL", "--", "npx", "-y", "@modelcontextprotocol/server-redis", "%%REDIS_URL%%"]

[mcp_servers.docker]
command = "node"
args = ["__AVF_LAUNCHER__", "--", "npx", "-y", "mcp-server-docker"]

# Firecrawl — веб-скрапинг/краулинг/поиск/extract (LLM-ready markdown и структура).
[mcp_servers.firecrawl]
command = "node"
args = ["__AVF_LAUNCHER__", "--need=FIRECRAWL_API_KEY", "--", "npx", "-y", "firecrawl-mcp"]

# Vercel — официальный удалённый MCP (Streamable HTTP + OAuth).
# Codex откроет браузер для авторизации при первом вызове.
[mcp_servers.vercel]
url = "https://mcp.vercel.com"

# Render — официальный удалённый MCP (Streamable HTTP + OAuth или API-ключ).
# OAuth: codex mcp add render --url https://mcp.render.com/mcp --oauth-client-id codex
[mcp_servers.render]
url = "https://mcp.render.com/mcp"
# API-ключ (headless/CI) вместо OAuth — раскомментируйте и впишите ключ:
# http_headers = { Authorization = "Bearer <RENDER_API_KEY>" }

# Task Master — управление задачами (PRD → задачи → статусы). Ключи опциональны.
# ANTHROPIC_API_KEY / OPENAI_API_KEY / PERPLEXITY_API_KEY берутся из ~/.config/agent-vorcl-flow/.env.
[mcp_servers.task-master]
command = "node"
args = ["__AVF_LAUNCHER__", "--", "npx", "-y", "task-master-ai"]
env = { TASK_MASTER_TOOLS = "parse_prd,get_tasks,get_task,next_task,expand_task,set_task_status,update_subtask,add_task,analyze_project_complexity,models" }

# Mermaid — генерация/валидация/рендер Mermaid-диаграмм (self-hosted, без ключей).
[mcp_servers.mermaid]
command = "node"
args = ["__AVF_LAUNCHER__", "--", "npx", "-y", "mcp-mermaid"]

# ===== Профили под роли (codex --profile architect | principal-architect | backend | frontend | expo-mobile | analyzer | integrity | swagger | firecrawl | render | database | resilience | screenshot | design-studio | pinpoint | drawio | mermaid | archmap | testing | gitflow | security | docs | devops | liveboard) =====
[profiles.architect]
model_reasoning_effort = "high"
