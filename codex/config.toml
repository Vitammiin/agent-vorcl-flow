# Agent-Vorcl-Flow — конфиг для Codex CLI.
# Вставьте в ~/.codex/config.toml или примените scripts/install.sh.

# ===== MCP-серверы =====
[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
env = { GITHUB_PERSONAL_ACCESS_TOKEN = "" }   # впишите токен

[mcp_servers.filesystem]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "."]

[mcp_servers.postgres]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-postgres", "postgres://user:pass@localhost:5432/db"]  # впишите URL

# MongoDB — официальный MCP-сервер. Для аудита добавьте аргумент "--readOnly".
[mcp_servers.mongodb]
command = "npx"
args = ["-y", "mongodb-mcp-server@latest"]
env = { MDB_MCP_CONNECTION_STRING = "" }   # впишите mongodb:// URI

[mcp_servers.redis]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-redis", "redis://localhost:6379"]

[mcp_servers.docker]
command = "npx"
args = ["-y", "mcp-server-docker"]

# Firecrawl — веб-скрапинг/краулинг/поиск/extract (LLM-ready markdown и структура).
[mcp_servers.firecrawl]
command = "npx"
args = ["-y", "firecrawl-mcp"]
# Ключ берётся из окружения — экспортируйте FIRECRAWL_API_KEY (или инлайн: env = { FIRECRAWL_API_KEY = "fc-..." }).

# Vercel — официальный удалённый MCP (Streamable HTTP + OAuth).
# Codex откроет браузер для авторизации при первом вызове.
[mcp_servers.vercel]
url = "https://mcp.vercel.com"

# Render — официальный удалённый MCP (Streamable HTTP + OAuth или API-ключ).
# OAuth: codex mcp add render --url https://mcp.render.com/mcp --oauth-client-id codex
[mcp_servers.render]
url = "https://mcp.render.com/mcp"
# API-ключ (headless/CI) вместо OAuth — раскомментируйте и впишите ключ:
# http_headers = { Authorization = "Bearer <RENDER_API_KEY>" }

# Task Master — управление задачами (PRD → задачи → статусы). Ключи опциональны.
# ANTHROPIC_API_KEY (Claude) / OPENAI_API_KEY (GPT) берутся из окружения.
# PERPLEXITY_API_KEY нужен только при выборе Perplexity как research-модели.
[mcp_servers.task-master]
command = "npx"
args = ["-y", "task-master-ai"]
env = { TASK_MASTER_TOOLS = "parse_prd,get_tasks,get_task,next_task,expand_task,set_task_status,update_subtask,add_task,analyze_project_complexity,models" }

# Mermaid — генерация/валидация/рендер Mermaid-диаграмм (self-hosted, без ключей).
[mcp_servers.mermaid]
command = "npx"
args = ["-y", "mcp-mermaid"]

# ===== Профили под роли (codex --profile architect | backend | frontend | analyzer | swagger | firecrawl | render | database | resilience | screenshot | pinpoint | drawio | mermaid | testing | gitflow | security | docs | devops | liveboard) =====
[profiles.architect]
model_reasoning_effort = "high"
# model = "gpt-5.1-codex"   # при необходимости укажите модель

[profiles.backend]
model_reasoning_effort = "medium"

[profiles.frontend]
model_reasoning_effort = "medium"

[profiles.analyzer]
model_reasoning_effort = "high"

[profiles.swagger]
model_reasoning_effort = "high"

[profiles.firecrawl]
model_reasoning_effort = "medium"

[profiles.render]
model_reasoning_effort = "high"

[profiles.database]
model_reasoning_effort = "high"

[profiles.resilience]
model_reasoning_effort = "medium"

[profiles.screenshot]
model_reasoning_effort = "medium"

[profiles.visual-research]
model_reasoning_effort = "high"

[profiles.pinpoint]
model_reasoning_effort = "high"

[profiles.drawio]
model_reasoning_effort = "medium"

[profiles.mermaid]
